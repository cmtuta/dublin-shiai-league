<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dublin Shiai League 2027</title>
<style>
  :root {
    --navy: #16365c;
    --royal: #1f4e79;
    --royal-light: #2e6da4;
    --ink: #1a2a3a;
    --muted: #5b7a99;
    --panel: #eef3f8;
    --line: #dbe7f3;
    --bg: #f4f7fb;
    --red-side: #fdeeee;
    --red-ink: #7a1f1f;
    --hansoku: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.45;
  }
  header { background: var(--navy); color: #fff; }
  .head-inner {
    max-width: 920px;
    margin: 0 auto;
    padding: 20px 16px 12px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
  }
  header h1 { margin: 0; font-size: 28px; line-height: 1.2; }
  header .season { margin: 2px 0 0; font-size: 16px; color: #bcd3e8; }
  #seasonSelect {
    background: var(--navy);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.55);
    border-radius: 4px;
    font-size: 15px;
    padding: 4px 8px;
  }
  .head-right { text-align: right; flex-shrink: 0; }
  #loginState { display: block; font-size: 13px; color: #bcd3e8; margin-bottom: 6px; }
  nav.tabs {
    max-width: 920px;
    margin: 0 auto;
    padding: 0 16px;
    display: flex;
    gap: 4px;
  }
  .tab {
    background: none;
    border: none;
    border-bottom: 3px solid transparent;
    color: #bcd3e8;
    font-size: 16px;
    padding: 10px 18px;
    cursor: pointer;
  }
  .tab:hover { color: #fff; }
  .tab.active { color: #fff; border-bottom-color: #fff; font-weight: 700; }
  main { max-width: 920px; margin: 0 auto; padding: 16px; }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 28px 16px 32px;
  }
  .btn {
    background: var(--royal);
    color: #fff;
    border: 1px solid var(--royal);
    border-radius: 4px;
    padding: 8px 14px;
    font-size: 14px;
    cursor: pointer;
  }
  .btn:hover { background: var(--royal-light); }
  .btn.light {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.55);
  }
  .btn.light:hover { background: rgba(255, 255, 255, 0.25); }
  .btn.ghost { background: #fff; color: var(--royal); }
  .btn.small { padding: 5px 10px; font-size: 13px; }
  .btn:disabled { opacity: 0.55; cursor: default; }
  .status {
    background: #e3eefb;
    color: var(--navy);
    border-radius: 4px;
    padding: 10px 12px;
    margin-bottom: 14px;
    font-size: 14px;
  }
  .status.error { background: #fdeeee; color: var(--red-ink); }
  .panel {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .panel h2 { margin: 0 0 10px; font-size: 19px; color: var(--navy); }
  .panel h3 { margin: 14px 0 8px; font-size: 15px; color: var(--navy); }
  .panel p { margin: 6px 0; }
  .empty { color: var(--muted); }
  /* Schedule */
  .sched-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 4px;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .sched-row:last-child { border-bottom: none; }
  .sched-num { color: var(--muted); font-size: 14px; min-width: 58px; }
  .sched-date { font-weight: 700; min-width: 150px; color: var(--navy); }
  .sched-label { flex: 1; min-width: 120px; }
  .sched-notes { color: var(--muted); font-size: 13px; width: 100%; }
  .badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    border-radius: 999px;
    padding: 3px 10px;
    white-space: nowrap;
  }
  .badge.complete { background: #e8edf1; color: var(--muted); }
  .badge.active { background: #e6f4ea; color: #1e7d32; }
  .badge.inactive { background: #fdeeee; color: var(--red-ink); }
  .badge.overridden { background: #fff3e0; color: #7a4a00; }
  /* Hall of Fame */
  table.hof { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.hof th {
    background: var(--navy);
    color: #fff;
    text-align: left;
    padding: 9px 8px;
    white-space: nowrap;
  }
  table.hof td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.hof tr:nth-child(even) td { background: var(--bg); }
  .hof-place { font-weight: 700; color: var(--navy); white-space: nowrap; }
  .hof-winner { font-weight: 700; }
  .hof-detail { color: var(--muted); font-size: 13px; }
  .hof-ctrl { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
  .hof-ctrl select { padding: 6px 8px; max-width: 180px; }
  .hof-note { color: var(--muted); font-size: 13px; }
  .sched-edit { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; width: 100%; }
  .sched-edit input, .sched-edit select { padding: 6px 8px; }
  /* Turns and matches */
  .turn-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    flex-wrap: wrap;
  }
  .turn-head h2 { margin: 0; }
  .turn-date { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .players-line { font-size: 14px; color: var(--muted); margin: 10px 0 4px; }
  .round-head {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 700;
    color: var(--navy);
    margin: 18px 0 8px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
  }
  .round-toggle { min-width: 30px; }
  .match {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    background: var(--panel);
    color: var(--muted);
    font-size: 13px;
    padding: 7px 12px;
  }
  .meta-right { display: flex; align-items: center; gap: 8px; }
  .pill {
    display: inline-block;
    background: var(--royal);
    color: #fff;
    border-radius: 999px;
    padding: 2px 10px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
  }
  .pill.hidden { visibility: hidden; }
  .fight {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: stretch;
    min-height: 62px;
  }
  .side {
    display: flex;
    align-items: center;
    padding: 12px 14px;
    font-size: 18px;
    font-weight: 600;
  }
  .side.white { background: #fff; justify-content: flex-end; text-align: right; }
  .side.red { background: var(--red-side); color: var(--red-ink); justify-content: flex-start; text-align: left; }
  .centre {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px;
    background: #e8edf1;
  }
  .centre-row {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .hansoku-select { color: var(--hansoku); }
  .score { font-size: 21px; font-weight: 700; min-width: 62px; text-align: center; }
  .slot {
    width: 18px;
    text-align: center;
    font-size: 15px;
    visibility: hidden;
  }
  .slot.on { visibility: visible; }
  .slot.ippon { color: var(--navy); }
  .slot.hansoku { color: var(--hansoku); }
  .hcount { font-size: 11px; font-weight: 700; vertical-align: super; }
  .hint { font-size: 12px; color: var(--muted); }
  select, input[type="text"], input[type="date"] {
    padding: 6px 8px;
    border: 1px solid #b9c9d8;
    border-radius: 4px;
    font-size: 14px;
    background: #fff;
  }
  /* Admin */
  .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 640px) { .admin-grid { grid-template-columns: 1fr; } }
  .admin-grid form { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .admin-grid input { width: 100%; }
  .turn-admin {
    border-top: 1px solid var(--line);
    margin-top: 14px;
    padding-top: 6px;
  }
  .plist {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
    margin: 6px 0 12px;
  }
  .plist label { font-size: 14px; }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btnrow select { padding: 6px 8px; }
  .section-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .section-head h3 { margin: 0; }
  .section-actions { display: flex; gap: 8px; }
  .fs-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .fs-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #e8edf1;
    border-radius: 999px;
    padding: 3px 6px 3px 10px;
    font-size: 14px;
  }
  .fs-chip .btn { padding: 2px 7px; font-size: 13px; }
  .bye-line { color: var(--muted); font-style: italic; margin: 4px 0 8px 2px; }
  /* Scoreboard */
  table.scoreboard { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.scoreboard th {
    background: var(--navy);
    color: #fff;
    text-align: right;
    padding: 9px 8px;
    white-space: nowrap;
  }
  table.scoreboard th:first-child, table.scoreboard td:first-child { text-align: center; }
  table.scoreboard th:nth-child(2), table.scoreboard td:nth-child(2) { text-align: left; }
  table.scoreboard td { padding: 8px; text-align: right; border-bottom: 1px solid var(--line); }
  table.scoreboard tr:nth-child(even) td { background: var(--bg); }
  .updated { color: var(--muted); font-size: 13px; margin-top: 10px; }
  /* Fighters */
  .btn.danger { background: #c0392b; border-color: #c0392b; }
  .btn.danger:hover { background: #a93226; }
  .pick-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 10px;
    margin: 14px 0;
  }
  .stat { background: var(--panel); border-radius: 6px; padding: 10px 12px; }
  .stat .num { font-size: 22px; font-weight: 700; color: var(--navy); }
  .stat .lbl { font-size: 12px; color: var(--muted); }
  .to-top {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 20;
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(22, 54, 92, 0.35);
  }
  .to-top[hidden] { display: none; }
  /* Login modal */
  .modal[hidden] { display: none; }
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(22, 54, 92, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 10;
  }
  .modal-card {
    background: #fff;
    border-radius: 8px;
    padding: 22px;
    width: 100%;
    max-width: 360px;
  }
  .modal-card h2 { margin: 0 0 12px; color: var(--navy); font-size: 20px; }
  .modal-card form { display: flex; flex-direction: column; gap: 10px; }
  .modal-card label { font-size: 14px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
  .error { color: var(--red-ink); font-size: 14px; margin: 0; }
</style>
</head>
<body>
<header>
  <div class="head-inner">
    <div>
      <h1>Dublin Shiai League</h1>
      <p class="season"><select id="seasonSelect" aria-label="Season">
        <option value="2027">2027 season</option>
      </select></p>
    </div>
    <div class="head-right">
      <span id="loginState"></span>
      <button id="loginBtn" class="btn light">Login</button>
      <button id="logoutBtn" class="btn light" hidden>Log out</button>
    </div>
  </div>
  <nav class="tabs">
    <button class="tab active" data-tab="schedule">Schedule</button>
    <button class="tab" data-tab="results">Results</button>
    <button class="tab" data-tab="scoreboard">Scoreboard</button>
    <button class="tab" data-tab="fighters">Fighters</button>
    <button class="tab" data-tab="halloffame" id="hofTabBtn">Hall of Fame</button>
    <button class="tab" data-tab="admin" id="adminTabBtn" hidden>Admin</button>
  </nav>
</header>

<main>
  <div id="statusLine" class="status" hidden></div>
  <section id="tab-schedule" class="tabpage"></section>
  <section id="tab-results" class="tabpage" hidden></section>
  <section id="tab-scoreboard" class="tabpage" hidden></section>
  <section id="tab-fighters" class="tabpage" hidden></section>
  <section id="tab-halloffame" class="tabpage" hidden></section>
  <section id="tab-admin" class="tabpage" hidden></section>
</main>

<footer id="pageFooter">Dublin Kendo Kobukai · Dublin Shiai League 2027</footer>

<button id="toTopBtn" class="to-top" hidden>↑ Top</button>

<div id="loginModal" class="modal" hidden>
  <div class="modal-card">
    <h2>Login</h2>
    <form id="loginForm">
      <label>Username
        <input id="loginUser" type="text" autocomplete="username" required>
      </label>
      <label>Password
        <input id="loginPass" type="password" autocomplete="current-password" required>
      </label>
      <p id="loginError" class="error" hidden></p>
      <div>
        <button class="btn" type="submit">Log in</button>
        <button class="btn ghost" type="button" id="loginCancel">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script>
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxLDxB_UVzAxepjPToFO78-atoZZcFGfbSZX0bzr6IOyAuXZNuAfqkPpeO6lrSDYZWO/exec";

var appState = null;
// The app is hidden behind a login, even for viewers. A session is a
// token from the server (stored here, sent with every request); the
// logged-in user and their role come back with getState. Roles:
// 'viewer' (read-only), 'editor' (can make changes), 'admin' (the
// dublinshiaileague account only, sees the Admin tab).
var sessionToken = null;
var currentUser = null;
var adminUsers = null; // user list for the Admin tab, fetched on demand
try { sessionToken = localStorage.getItem('dsl_token') || null; } catch (err) { /* private mode */ }
var currentTab = 'schedule';
var editingTurnDate = null;
var statusTimer = null;
var collapsedRounds = {}; // "turnId:round" -> true when that round is collapsed
var saveTimers = {}; // matchId -> pending auto-save timer

// Seasons: the player list and Elo carry over year to year, but the
// schedule, results, scoreboard and fighter stats are all for the
// selected season only. A turn belongs to the year of its date.
// "All time" (selectedSeason === 'all') lifts the season filter and
// shows everything consolidated across all seasons.
var SEASONS = [2027];
var selectedSeason = 2027;
try {
  var savedSeason = localStorage.getItem('dsl_season') || '';
  if (savedSeason === 'all') selectedSeason = 'all';
  else {
    var savedYear = parseInt(savedSeason, 10);
    if (SEASONS.indexOf(savedYear) >= 0) selectedSeason = savedYear;
  }
} catch (err) { /* private mode: stay on 2027 */ }

function isAllTime() {
  return selectedSeason === 'all';
}

// Whether a turn's year belongs to the current view: every year when
// "All time" is selected, otherwise only the selected season.
function seasonIncludes(year) {
  return isAllTime() || year === selectedSeason;
}

function turnYear(t) {
  return t && t.date ? parseInt(String(t.date).substring(0, 4), 10) : null;
}

// Seasons offered in the dropdown: the list the server returns (only
// 2027 pre-loaded, plus any year an editor added), falling back to the
// built-in list before the first state load.
function availableSeasons() {
  if (appState && appState.seasons && appState.seasons.length) return appState.seasons;
  return SEASONS;
}

function applySeasonChrome() {
  var label = isAllTime() ? 'All time' : selectedSeason;
  document.title = 'Dublin Shiai League ' + label;
  var footer = document.getElementById('pageFooter');
  if (footer) footer.textContent = 'Dublin Kendo Kobukai · Dublin Shiai League ' + label;
  var sel = document.getElementById('seasonSelect');
  if (sel) {
    var list = availableSeasons();
    sel.innerHTML = '<option value="all"' + (isAllTime() ? ' selected' : '') + '>All time</option>' +
      list.map(function (y) {
        return '<option value="' + y + '"' + (y === selectedSeason ? ' selected' : '') + '>' + y + ' season</option>';
      }).join('');
    sel.value = String(selectedSeason);
  }
}

// Alphabetical by display name ("First Last"), case-insensitive.
function compareName(a, b) {
  var an = (a && a.name ? a.name : '').toLowerCase();
  var bn = (b && b.name ? b.name : '').toLowerCase();
  return an < bn ? -1 : (an > bn ? 1 : 0);
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function isLoggedIn() {
  return !!sessionToken;
}

function isEditor() {
  return !!(currentUser && (currentUser.role === 'editor' || currentUser.role === 'admin'));
}

function isAdmin() {
  return !!(currentUser && currentUser.role === 'admin');
}

function showStatus(msg, isError) {
  var el = document.getElementById('statusLine');
  el.textContent = msg;
  el.classList.toggle('error', !!isError);
  el.hidden = false;
  if (statusTimer) clearTimeout(statusTimer);
  statusTimer = setTimeout(function () { el.hidden = true; }, 6000);
}

// '2027-01-29' -> 'Fri 29 Jan 2027'. Parsed as a local date to avoid shifts.
function fmtDate(iso) {
  if (!iso) return 'Date to be confirmed';
  var parts = String(iso).split('-');
  if (parts.length !== 3) return iso;
  var d = new Date(+parts[0], +parts[1] - 1, +parts[2]);
  if (isNaN(d.getTime())) return iso;
  return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
}

function matchNum(matchId) {
  var m = /-M(\d+)$/.exec(matchId || '');
  return m ? parseInt(m[1], 10) : 0;
}

function playerById(id) {
  if (!appState) return null;
  for (var i = 0; i < appState.players.length; i++) {
    if (appState.players[i].id === id) return appState.players[i];
  }
  return null;
}

function playerName(id) {
  var p = playerById(id);
  return p ? p.name : 'Unknown player';
}

/* ---------- data access ---------- */

async function fetchState() {
  if (!WEBAPP_URL) {
    showStatus('Add the Apps Script web app URL to WEBAPP_URL in index.html.', true);
    return;
  }
  if (!sessionToken) {
    // Not logged in: the app is hidden behind a login, so show the
    // login form and a prompt instead of the league content.
    appState = null;
    currentUser = null;
    render();
    document.getElementById('loginModal').hidden = false;
    return;
  }
  try {
    // Cache-buster: without it the browser (or the Apps Script front
    // end) can serve the previous getState response, so a change made by
    // an action (Hall of Fame toggle, override, round complete) would
    // only show after a reload even though fetchState re-rendered.
    var res = await fetch(WEBAPP_URL + '?action=getState&token=' + encodeURIComponent(sessionToken) + '&t=' + Date.now());
    var data = await res.json();
    if (!data.ok) {
      if (data.error === 'Login required.') {
        // The session is gone (logged out elsewhere, or the Admin
        // deleted the user): drop the token and ask to log in again.
        sessionToken = null;
        currentUser = null;
        adminUsers = null;
        try { localStorage.removeItem('dsl_token'); } catch (err) { /* private mode */ }
        appState = null;
        render();
        document.getElementById('loginModal').hidden = false;
        showStatus('Your session ended. Please log in again.', true);
        return;
      }
      throw new Error(data.error || 'Could not load the league data.');
    }
    appState = data;
    currentUser = data.currentUser || null;
    // Defensive: older backends returned a single Fighting Spirit id
    // (a string) instead of a list; normalise it so the list code below
    // never breaks during a deploy.
    (appState.turns || []).forEach(function (t) {
      if (typeof t.fightingSpirit === 'string') {
        t.fightingSpirit = t.fightingSpirit ? [t.fightingSpirit] : [];
      }
      if (!Array.isArray(t.fightingSpirit)) t.fightingSpirit = [];
    });
    if (!Array.isArray(appState.byes)) appState.byes = [];
    render();
  } catch (err) {
    showStatus('Could not load the league data. Please try again later.', true);
  }
}

async function api(action, payload) {
  var body = { action: action };
  if (sessionToken) body.token = sessionToken;
  if (payload) {
    for (var k in payload) body[k] = payload[k];
  }
  var res = await fetch(WEBAPP_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  });
  var data = await res.json();
  if (!data.ok) throw new Error(data.error || 'Request failed.');
  return data;
}

/* ---------- rendering ---------- */

function render() {
  var y = window.scrollY;
  applySeasonChrome();
  if (!isLoggedIn() || !appState) {
    // Hidden behind a login: show a prompt in every tab until the user
    // logs in. The login modal is opened by fetchState.
    var prompt = '<div class="panel"><h2>Login required</h2><p>Please log in to view the Dublin Shiai League.</p>' +
      '<p><button class="btn" data-action="open-login">Login</button></p></div>';
    ['schedule', 'results', 'scoreboard', 'fighters', 'halloffame', 'admin'].forEach(function (tab) {
      var sec = document.getElementById('tab-' + tab);
      if (sec) sec.innerHTML = prompt;
    });
    updateHofTabVisibility();
    updateAdminTabVisibility();
    updateAuthUI();
    window.scrollTo(0, y);
    return;
  }
  renderSchedule();
  renderResults();
  renderScoreboard();
  renderFighters();
  renderHallOfFame();
  renderAdmin();
  updateHofTabVisibility();
  updateAdminTabVisibility();
  updateAuthUI();
  window.scrollTo(0, y);
}

function updateAuthUI() {
  document.getElementById('loginBtn').hidden = isLoggedIn();
  document.getElementById('logoutBtn').hidden = !isLoggedIn();
  var label = '';
  if (currentUser) {
    label = 'Logged in as ' + (currentUser.name || currentUser.username) +
      (currentUser.role === 'admin' ? ' (admin)' : currentUser.role === 'editor' ? ' (editor)' : ' (viewer)');
  }
  document.getElementById('loginState').textContent = label;
}

// The Admin tab is only for the dublinshiaileague admin account.
function updateAdminTabVisibility() {
  var btn = document.getElementById('adminTabBtn');
  if (!btn) return;
  btn.hidden = !isAdmin();
  if (!isAdmin() && currentTab === 'admin') setTab('schedule');
}

function renderSchedule() {
  var el = document.getElementById('tab-schedule');
  if (!appState) { el.innerHTML = '<div class="panel"><p>Loading...</p></div>'; return; }
  // The schedule IS the turns, for the selected season only, in date
  // order. The turn number is the position in that order (Turn 1 is
  // the season's first turn). "All time" lists every turn, in date order.
  var turns = appState.turns.slice().sort(function (a, b) {
    return (a.date || '').localeCompare(b.date || '');
  }).filter(function (t) { return seasonIncludes(turnYear(t)); });
  if (!turns.length) {
    el.innerHTML = '<div class="panel"><p class="empty">No league dates yet' + (isAllTime() ? '.' : ' in ' + selectedSeason + '.') + '</p></div>';
    return;
  }
  var html = '<div class="panel"><h2>League dates</h2>';
  turns.forEach(function (t, i) {
    html += '<div class="sched-row">' +
      '<span class="sched-num">Turn ' + (i + 1) + '</span>' +
      '<span class="sched-date">' + esc(t.name) + '</span>';
    if (t.playerCount > 0) {
      html += '<span class="sched-label">' + t.playerCount + (t.playerCount === 1 ? ' player' : ' players') + '</span>';
    }
    if (t.fightingSpiritName) {
      html += '<span class="sched-notes">Fighting Spirit: ' + esc(t.fightingSpiritName) + '</span>';
    }
    if (t.status === 'Complete') {
      html += '<span class="badge complete">Complete</span>';
    }
    if (isEditor() && t.status !== 'Complete') {
      if (editingTurnDate === t.id) {
        html += '<div class="sched-edit">' +
          '<input type="date" id="te-date-' + esc(t.id) + '" value="' + esc(t.date) + '">' +
          '<button class="btn small" data-action="save-turn-date" data-turn="' + esc(t.id) + '">Save</button>' +
          '<button class="btn small danger" data-action="delete-turn" data-turn="' + esc(t.id) + '">Delete turn</button>' +
          '<button class="btn small ghost" data-action="cancel-turn-date">Cancel</button>' +
        '</div>';
      } else {
        html += '<button class="btn small ghost" data-action="edit-turn-date" data-turn="' + esc(t.id) + '">Edit date</button>';
      }
    }
    html += '</div>';
  });
  html += '</div>';
  el.innerHTML = html;
}

// One ippon slot in public view: shows the type initial (M, K, D, T, H, I)
// when the slot holds an ippon, and stays an invisible fixed placeholder
// when empty so the layout never shifts.
function ipponSlot(type) {
  var initial = type ? IPPON_INITIALS[type] : '';
  return '<span class="slot ippon' + (type ? ' on' : '') + '">' + (initial || '&nbsp;') + '</span>';
}

function hansokuSlot(count) {
  if (count <= 0) return '<span class="slot hansoku">▲</span>';
  return '<span class="slot hansoku on">▲' + (count > 1 ? '<span class="hcount">' + count + '</span>' : '') + '</span>';
}

function centreHtml(m) {
  // Outside to inside: hansoku, first ippon, second ippon, score, second ippon, first ippon, hansoku.
  // The ippon slots show the type initial in public view too, not just in
  // the editor dropdowns; an untyped ippon shows as generic Ippon (I).
  var wTypes = effectiveTypes(m, 'white');
  var rTypes = effectiveTypes(m, 'red');
  return hansokuSlot(m.whiteHansoku) +
    ipponSlot(wTypes[0]) + ipponSlot(wTypes[1]) +
    '<span class="score">' + m.whiteIppon + ' - ' + m.redIppon + '</span>' +
    ipponSlot(rTypes[1]) + ipponSlot(rTypes[0]) +
    hansokuSlot(m.redHansoku);
}

var IPPON_TYPES = ['Men', 'Kote', 'Do', 'Tsuki', 'Hansoku', 'Ippon'];
var IPPON_INITIALS = { Men: 'M', Kote: 'K', Do: 'D', Tsuki: 'T', Hansoku: 'H', Ippon: 'I' };

// The type dropdowns show only the initial (M, K, D, T, H, I). A blank
// dropdown is no ippon in that slot.
function ipponTypeOptions(v) {
  var html = '<option value=""></option>';
  IPPON_TYPES.forEach(function (t) {
    html += '<option value="' + t + '"' + (v === t ? ' selected' : '') + '>' + IPPON_INITIALS[t] + '</option>';
  });
  return html;
}

// One hansoku dropdown per side: blank for none, a single red triangle
// for one hansoku. A player never holds two at once: a second hansoku
// is an ippon for the opponent (recorded as H) and the counter resets.
function hansokuOptions(v) {
  return '<option value="0"' + (v === 0 ? ' selected' : '') + '></option>' +
    '<option value="1"' + (v === 1 ? ' selected' : '') + '>▲</option>';
}

// A single ippon-type dropdown for one ippon slot of a side.
function ipponTypeSelectHtml(side, i, value) {
  var label = (side === 'white' ? 'White' : 'Red') + ' ippon ' + (i + 1);
  return '<select data-f="' + side + 'IpponType' + i + '" title="' + label + '" aria-label="' + label + '">' +
    ipponTypeOptions(value || '') + '</select>';
}

// The two type dropdowns for a side, with any ippon recorded without a
// type shown as a generic Ippon (I) so the count and the dropdowns agree.
function effectiveTypes(m, side) {
  var count = side === 'white' ? m.whiteIppon : m.redIppon;
  var types = side === 'white' ? (m.whiteIpponTypes || []) : (m.redIpponTypes || []);
  var out = [];
  for (var i = 0; i < 2; i++) {
    out.push(types[i] || (i < count ? 'Ippon' : ''));
  }
  return out;
}

// Options for the fighter selects in a match card: the turn's competing
// players, alphabetical, plus the match's current fighter if they are
// no longer in the turn (so the select always holds its value).
function matchPlayerOptionsHtml(turn, currentId) {
  var ids = {};
  appState.turnPlayers.forEach(function (tp) {
    if (tp.turnId === turn.id) ids[tp.playerId] = true;
  });
  if (currentId) ids[currentId] = true;
  var players = appState.players.filter(function (p) { return ids[p.id]; }).sort(compareName);
  return players.map(function (p) {
    return '<option value="' + esc(p.id) + '"' + (p.id === currentId ? ' selected' : '') + '>' + esc(p.name) + '</option>';
  }).join('');
}

function matchCardHtml(m, turn) {
  var meta = esc(turn.name) + ' · Round ' + m.round + ' · Match ' + matchNum(m.id);
  // A match shows as Completed when its round is marked complete or its
  // turn is, not merely when a result was recorded. A locked match is
  // read-only even for an editor: it renders exactly like the public
  // view (names as text, initials in the centre, no delete button)
  // until its round (or the turn) is unmarked complete.
  var locked = !!m.roundComplete || turn.status === 'Complete';
  var showEditor = isEditor() && !locked;
  var pill = '<span class="pill' + (locked ? '' : ' hidden') + '">Completed</span>';
  var delBtn = showEditor
    ? '<button class="btn small danger" data-action="delete-match" data-match="' + esc(m.id) + '">Delete match</button>'
    : '';
  var whiteSide = showEditor
    ? '<select data-f="whitePlayer" title="White fighter" aria-label="White fighter">' + matchPlayerOptionsHtml(turn, m.whiteId) + '</select>'
    : '<span>' + esc(playerName(m.whiteId)) + '</span>';
  var redSide = showEditor
    ? '<select data-f="redPlayer" title="Red fighter" aria-label="Red fighter">' + matchPlayerOptionsHtml(turn, m.redId) + '</select>'
    : '<span>' + esc(playerName(m.redId)) + '</span>';
  // Nationals-style centre: one type dropdown per ippon slot (two per
  // fighter), showing only the initial, next to the score; the hansoku
  // dropdown sits beside them (hansoku outermost) and shows a single red
  // triangle. The score is the count of filled type dropdowns per side.
  // There is no ippon-count dropdown and no Save button: changing any
  // dropdown saves the match automatically.
  var centreInner;
  if (showEditor) {
    var wTypes = effectiveTypes(m, 'white');
    var rTypes = effectiveTypes(m, 'red');
    centreInner = '<div class="centre-row">' +
      '<select data-f="whiteHansoku" class="hansoku-select" title="White hansoku" aria-label="White hansoku">' + hansokuOptions(m.whiteHansoku) + '</select>' +
      ipponTypeSelectHtml('white', 0, wTypes[0]) +
      ipponTypeSelectHtml('white', 1, wTypes[1]) +
      '<span class="score">' + m.whiteIppon + ' - ' + m.redIppon + '</span>' +
      ipponTypeSelectHtml('red', 1, rTypes[1]) +
      ipponTypeSelectHtml('red', 0, rTypes[0]) +
      '<select data-f="redHansoku" class="hansoku-select" title="Red hansoku" aria-label="Red hansoku">' + hansokuOptions(m.redHansoku) + '</select>' +
    '</div>';
  } else {
    centreInner = '<div class="centre-row">' + centreHtml(m) + '</div>';
  }
  var html = '<div class="match" data-match="' + esc(m.id) + '">' +
    '<div class="meta"><span>' + meta + '</span><span class="meta-right">' + pill + delBtn + '</span></div>' +
    '<div class="fight">' +
      '<div class="side white">' + whiteSide + '</div>' +
      '<div class="centre">' + centreInner + '</div>' +
      '<div class="side red">' + redSide + '</div>' +
    '</div>';
  html += '</div>';
  return html;
}

function turnPlayersHtml(turnId) {
  var ids = appState.turnPlayers
    .filter(function (tp) { return tp.turnId === turnId; })
    .map(function (tp) { return tp.playerId; });
  if (!ids.length) return '<p class="players-line">No players selected for this turn yet.</p>';
  var names = ids.map(function (id) { return playerById(id); })
    .sort(compareName)
    .map(function (p) { return p ? esc(p.name) : 'Unknown player'; });
  return '<p class="players-line">Competing: ' + names.join(', ') + '</p>';
}

function turnAdminHtml(t) {
  // A completed turn is fully locked: no player, round, Fighting Spirit
  // or date changes. Only the Unmark complete button stays, so the
  // turn can be reopened.
  if (t.status === 'Complete') {
    return '<div class="turn-admin"><p class="hint">This turn is marked complete. Nothing in it can be edited until it is unmarked.</p><div class="btnrow">' +
      '<button class="btn" data-action="mark-complete" data-turn="' + esc(t.id) + '">Unmark complete</button>' +
    '</div></div>';
  }
  var selected = {};
  appState.turnPlayers.forEach(function (tp) {
    if (tp.turnId === t.id) selected[tp.playerId] = true;
  });
  var html = '<div class="turn-admin"><div class="section-head"><h3>Competing players</h3><span class="section-actions">' +
    '<button class="btn small ghost" data-action="select-all-players" data-turn="' + esc(t.id) + '">Select all</button>' +
    '<button class="btn small ghost" data-action="unselect-all-players" data-turn="' + esc(t.id) + '">Unselect all</button>' +
  '</span></div><div class="plist">';
  appState.players.slice().sort(compareName).forEach(function (p) {
    html += '<label><input type="checkbox" data-turn="' + esc(t.id) + '" value="' + esc(p.id) + '"' +
      (selected[p.id] ? ' checked' : '') + '> ' + esc(p.name) + '</label>';
  });
  if (!appState.players.length) html += '<span class="empty">No players yet. Add a player above first.</span>';
  // A new round cannot be generated until the previous round is marked
  // complete (the first round in a turn has no previous round). The
  // server enforces the same rule; the button is disabled here so the
  // recorder sees why.
  var prevRound = 0;
  (appState.matches || []).forEach(function (m) {
    if (m.turnId === t.id && m.round > prevRound) prevRound = m.round;
  });
  var prevRoundComplete = prevRound === 0 || t.status === 'Complete' ||
    (appState.matches || []).some(function (m) {
      return m.turnId === t.id && m.round === prevRound && m.roundComplete;
    });
  html += '</div><div class="btnrow">' +
    '<button class="btn" data-action="save-turn-players" data-turn="' + esc(t.id) + '">Save players</button>' +
    '<button class="btn" data-action="generate-round" data-turn="' + esc(t.id) + '"' + (prevRoundComplete ? '' : ' disabled') + '>Generate next round</button>' +
    '<button class="btn" data-action="mark-complete" data-turn="' + esc(t.id) + '">' + (t.status === 'Complete' ? 'Unmark complete' : 'Mark complete') + '</button>' +
  '</div>';
  if (!prevRoundComplete) {
    html += '<p class="hint">Mark Round ' + prevRound + ' complete before generating the next round.</p>';
  }
  var competing = appState.players.filter(function (p) { return selected[p.id]; }).sort(compareName);
  html += '<h3>Fighting Spirit awards</h3><div class="btnrow">';
  if (!competing.length) {
    html += '<span class="empty">Select the competing players above first.</span>';
  } else {
    var winners = (t.fightingSpirit || []).map(function (id) { return playerById(id); }).filter(function (p) { return !!p; });
    if (winners.length) {
      html += '<span class="fs-list">' + winners.map(function (p) {
        return '<span class="fs-chip">' + esc(p.name) +
          ' <button class="btn small danger" data-action="remove-fighting-spirit" data-turn="' + esc(t.id) + '" data-player="' + esc(p.id) + '" aria-label="Remove ' + esc(p.name) + ' from Fighting Spirit">×</button></span>';
      }).join('') + '</span>';
    }
    var remaining = competing.filter(function (p) { return (t.fightingSpirit || []).indexOf(p.id) === -1; });
    if (remaining.length) {
      html += '<select id="fs-add-' + esc(t.id) + '">' +
        '<option value="">Add a winner...</option>' +
        remaining.map(function (p) {
          return '<option value="' + esc(p.id) + '">' + esc(p.name) + '</option>';
        }).join('') +
      '</select>' +
      '<button class="btn" data-action="add-fighting-spirit" data-turn="' + esc(t.id) + '">Add</button>';
    }
  }
  html += '</div></div>';
  return html;
}

var selectedResultsTurnId = null;

function turnPanelHtml(t) {
  // The only status is Complete (or empty): show a badge only when the
  // turn is Complete, and nothing otherwise.
  var badge = t.status === 'Complete' ? '<span class="badge complete">Complete</span>' : '';
  var meta = [];
  if (t.playerCount > 0) meta.push(t.playerCount + (t.playerCount === 1 ? ' player' : ' players'));
  if (t.fightingSpiritName) meta.push('Fighting Spirit: ' + t.fightingSpiritName);
  var html = '<div class="panel"><div class="turn-head"><div>' +
    '<h2>' + esc(t.name) + '</h2>' +
    (meta.length ? '<div class="turn-date">' + esc(meta.join(' · ')) + '</div>' : '') +
    '</div>' + badge + '</div>';
  html += turnPlayersHtml(t.id);
  // The competing-players and Fighting Spirit section comes before the
  // rounds, so the editor sets up the turn before recording its matches.
  if (isEditor()) html += turnAdminHtml(t);
  var ms = appState.matches
    .filter(function (m) { return m.turnId === t.id; })
    .sort(function (a, b) {
      if (a.round !== b.round) return a.round - b.round;
      return matchNum(a.id) - matchNum(b.id);
    });
  if (!ms.length) {
    html += '<p class="empty">No matches yet - generate the first round.</p>';
  } else {
    // Grouped by round so each round can be collapsed and deleted.
    var byRound = {};
    ms.forEach(function (m) { (byRound[m.round] = byRound[m.round] || []).push(m); });
    Object.keys(byRound).map(Number).sort(function (a, b) { return a - b; }).forEach(function (r) {
      var key = t.id + ':' + r;
      var collapsed = !!collapsedRounds[key];
      // A round is complete when it is marked complete or its turn is.
      // The Mark/Unmark button is editor-only and hidden while the turn
      // is complete, since a round cannot be unmarked on its own then.
      var roundComplete = t.status === 'Complete' || byRound[r].some(function (m) { return m.roundComplete; });
      var roundBtn = '';
      if (isEditor() && t.status !== 'Complete') {
        roundBtn = '<button class="btn small" data-action="mark-round-complete" data-turn="' + esc(t.id) + '" data-round="' + r + '">' + (roundComplete ? 'Unmark complete' : 'Mark complete') + '</button>';
      }
      html += '<div class="round-head">' +
        '<button class="btn small ghost round-toggle" data-action="toggle-round" data-turn="' + esc(t.id) + '" data-round="' + r + '" aria-expanded="' + (!collapsed) + '" aria-label="' + (collapsed ? 'Expand' : 'Collapse') + ' round ' + r + '">' + (collapsed ? '▸' : '▾') + '</button>' +
        '<span>Round ' + r + '</span>' +
        (roundComplete ? '<span class="badge complete">Complete</span>' : '') +
        roundBtn +
        (isEditor() && !roundComplete ? '<button class="btn small danger" data-action="delete-round" data-turn="' + esc(t.id) + '" data-round="' + r + '">Delete round</button>' : '') +
      '</div>';
      // Who sat out this round (recorded when the round was generated,
      // usually the one player left over when the count is odd).
      var roundByes = (appState.byes || []).filter(function (b) { return b.turnId === t.id && b.round === r; });
      if (roundByes.length) {
        var byeNames = roundByes.map(function (b) {
          var p = playerById(b.playerId);
          return p ? esc(p.name) : 'Unknown player';
        });
        html += '<p class="bye-line">Sitting out: ' + byeNames.join(', ') + '</p>';
      }
      if (!collapsed) {
        byRound[r].forEach(function (m) { html += matchCardHtml(m, t); });
      }
    });
  }
  html += '</div>';
  return html;
}

function renderResults() {
  var el = document.getElementById('tab-results');
  if (!appState) { el.innerHTML = '<div class="panel"><p>Loading...</p></div>'; return; }
  var html = '';
  if (isEditor()) {
    html += '<div class="panel"><h2>Editor panel</h2><div class="admin-grid">' +
      '<div><h3>Add a player</h3><form id="createPlayerForm">' +
        '<input type="text" id="npFirst" placeholder="First name" required>' +
        '<input type="text" id="npLast" placeholder="Last name" required>' +
        '<button class="btn" type="submit">Add player</button>' +
      '</form></div>' +
      '<div><h3>Create a turn</h3><form id="createTurnForm">' +
        '<input type="date" id="ntDate" required>' +
        '<button class="btn" type="submit">Create turn</button>' +
        '<p class="hint">The turn takes its name from its date.</p>' +
      '</form></div>' +
      '<div><h3>Add a season</h3><form id="createSeasonForm">' +
        '<input type="number" id="nsYear" placeholder="Year (e.g. 2036)" min="2000" max="2100" required>' +
        '<button class="btn" type="submit">Add season</button>' +
        '<p class="hint">Adds the year to the season dropdown for everyone.</p>' +
      '</form></div>' +
    '</div></div>';
  }
  // One turn at a time, picked from the dropdown. Chronological,
  // January first; the most recent turn is the default. Only this
  // season's turns are listed ("All time" lists every turn).
  var turns = appState.turns.slice().sort(function (a, b) {
    return (a.date || '').localeCompare(b.date || '');
  }).filter(function (t) { return seasonIncludes(turnYear(t)); });
  if (!turns.length) {
    html += '<div class="panel"><p class="empty">No turns yet' + (isAllTime() ? ' - create the first turn to get started.' : ' in ' + selectedSeason + ' - create the first turn to get started.') + '</p></div>';
    el.innerHTML = html;
    return;
  }
  if (!selectedResultsTurnId || !turns.some(function (t) { return t.id === selectedResultsTurnId; })) {
    selectedResultsTurnId = turns[turns.length - 1].id;
  }
  var t = null;
  turns.forEach(function (x) { if (x.id === selectedResultsTurnId) t = x; });
  html += '<div class="panel"><div class="pick-row"><label for="resultsTurnSelect">Turn</label>' +
    '<select id="resultsTurnSelect">' +
    turns.map(function (x) {
      return '<option value="' + esc(x.id) + '"' + (x.id === t.id ? ' selected' : '') + '>' + esc(x.name) + '</option>';
    }).join('') +
    '</select></div></div>';
  html += turnPanelHtml(t);
  el.innerHTML = html;
}

function scoreboardRows() {
  var s = appState.settings;
  // The scoreboard is specific to the selected season, and only shows
  // players who attended at least one turn in that season. "All time"
  // consolidates every season: attendance and matches across all years.
  var turnYearById = {};
  appState.turns.forEach(function (t) { turnYearById[t.id] = turnYear(t); });
  var attended = {};
  appState.turnPlayers.forEach(function (tp) {
    if (seasonIncludes(turnYearById[tp.turnId])) attended[tp.playerId] = true;
  });
  var rows = appState.players.filter(function (p) { return attended[p.id]; }).map(function (p) {
    return {
      id: p.id, name: p.name, elo: p.elo,
      played: 0, won: 0, drawn: 0, lost: 0, ipFor: 0, ipAgainst: 0, points: 0
    };
  });
  var byId = {};
  rows.forEach(function (r) { byId[r.id] = r; });
  // Only matches that count feed the scoreboard: a match counts when its
  // round is marked complete or its turn is. An unrecorded match that
  // counts is a 0-0 draw (1 point each, no ippons). Elo is the player's
  // current (global) rating, which carries over year to year.
  appState.matches.forEach(function (m) {
    if (!m.counts) return;
    if (!seasonIncludes(turnYearById[m.turnId])) return;
    var w = byId[m.whiteId];
    var r = byId[m.redId];
    if (!w || !r) return;
    w.played++;
    r.played++;
    w.ipFor += m.whiteIppon;
    w.ipAgainst += m.redIppon;
    r.ipFor += m.redIppon;
    r.ipAgainst += m.whiteIppon;
    var res = m.completed ? m.result : 'Draw';
    if (res === 'White') {
      w.won++; r.lost++;
      w.points += s.winPoints; r.points += s.lossPoints;
    } else if (res === 'Red') {
      r.won++; w.lost++;
      r.points += s.winPoints; w.points += s.lossPoints;
    } else if (res === 'Draw') {
      w.drawn++; r.drawn++;
      w.points += s.drawPoints; r.points += s.drawPoints;
    }
  });
  rows.sort(function (a, b) {
    if (b.points !== a.points) return b.points - a.points;
    if (b.ipFor !== a.ipFor) return b.ipFor - a.ipFor;
    if (b.elo !== a.elo) return b.elo - a.elo;
    return a.name.localeCompare(b.name);
  });
  return rows;
}

function renderScoreboard() {
  var el = document.getElementById('tab-scoreboard');
  if (!appState) { el.innerHTML = '<div class="panel"><p>Loading...</p></div>'; return; }
  var rows = scoreboardRows();
  var html = '<div class="panel"><h2>Scoreboard</h2>';
  if (!rows.length) {
    html += '<p class="empty">' + (appState.players.length
      ? (isAllTime() ? 'No players have attended a turn yet.' : 'No players have attended a turn in ' + selectedSeason + ' yet.')
      : 'No players yet - add a player to get started.') + '</p>';
  } else {
    html += '<table class="scoreboard"><thead><tr>' +
      '<th>Rank</th><th>Name</th><th>Points</th><th>Elo</th><th>Played</th><th>Won</th><th>Drawn</th><th>Lost</th>' +
      '<th>Ippon For</th><th>Ippon Against</th>' +
      '</tr></thead><tbody>';
    rows.forEach(function (r, i) {
      var active = isPlayerActive(r.id);
      html += '<tr><td>' + (i + 1) + '</td><td>' + esc(r.name) + ' ' +
        '<span class="badge ' + (active ? 'active' : 'inactive') + '">' + (active ? 'Active' : 'Inactive') + '</span></td><td><strong>' + r.points + '</strong></td><td>' + r.elo + '</td>' +
        '<td>' + r.played + '</td><td>' + r.won + '</td><td>' + r.drawn + '</td><td>' + r.lost + '</td>' +
        '<td>' + r.ipFor + '</td><td>' + r.ipAgainst + '</td></tr>';
    });
    html += '</tbody></table>';
  }
  if (appState.updatedAt) {
    var d = new Date(appState.updatedAt);
    html += '<p class="updated">Last updated ' +
      d.toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) + '</p>';
  }
  html += '</div>';
  el.innerHTML = html;
}

/* ---------- fighters ---------- */

var selectedFighterId = null;

function statHtml(num, label) {
  return '<div class="stat"><div class="num">' + num + '</div><div class="lbl">' + esc(label) + '</div></div>';
}

// Season stats for one fighter, computed from the state the page already has.
// Like the scoreboard, this is for the selected season only: turns
// attended, matches, ippons and awards all come from that year's turns.
function fighterStats(pid) {
  var s = appState.settings;
  var st = {
    elo: 0, points: 0, turns: 0, played: 0, won: 0, drawn: 0, lost: 0,
    ipFor: 0, ipAgainst: 0, hansoku: 0,
    types: { Men: 0, Kote: 0, Do: 0, Tsuki: 0, Hansoku: 0, Ippon: 0 },
    awards: []
  };
  var p = playerById(pid);
  if (p) st.elo = p.elo;
  var turnById = {};
  appState.turns.forEach(function (t) { turnById[t.id] = t; });
  appState.turnPlayers.forEach(function (tp) {
    if (tp.playerId !== pid) return;
    var t = turnById[tp.turnId];
    if (t && seasonIncludes(turnYear(t))) st.turns++;
  });
  appState.turns.forEach(function (t) {
    if ((t.fightingSpirit || []).indexOf(pid) !== -1 && seasonIncludes(turnYear(t))) st.awards.push(t);
  });
  appState.matches.forEach(function (m) {
    if (!m.counts) return;
    var mt = turnById[m.turnId];
    if (!mt || !seasonIncludes(turnYear(mt))) return;
    var isWhite = m.whiteId === pid;
    var isRed = m.redId === pid;
    if (!isWhite && !isRed) return;
    // An unrecorded match that counts is a 0-0 draw.
    var res = m.completed ? m.result : 'Draw';
    st.played++;
    if (isWhite) {
      st.ipFor += m.whiteIppon;
      st.ipAgainst += m.redIppon;
      st.hansoku += m.whiteHansoku;
      (m.whiteIpponTypes || []).forEach(function (t) { if (st.types[t] !== undefined) st.types[t]++; });
      if (res === 'White') { st.won++; st.points += s.winPoints; }
      else if (res === 'Red') { st.lost++; st.points += s.lossPoints; }
      else if (res === 'Draw') { st.drawn++; st.points += s.drawPoints; }
    } else {
      st.ipFor += m.redIppon;
      st.ipAgainst += m.whiteIppon;
      st.hansoku += m.redHansoku;
      (m.redIpponTypes || []).forEach(function (t) { if (st.types[t] !== undefined) st.types[t]++; });
      if (res === 'Red') { st.won++; st.points += s.winPoints; }
      else if (res === 'White') { st.lost++; st.points += s.lossPoints; }
      else if (res === 'Draw') { st.drawn++; st.points += s.drawPoints; }
    }
  });
  return st;
}

function renderFighters() {
  var el = document.getElementById('tab-fighters');
  if (!appState) { el.innerHTML = '<div class="panel"><p>Loading...</p></div>'; return; }
  var players = appState.players.slice().sort(function (a, b) { return a.name.localeCompare(b.name); });
  if (!players.length) {
    el.innerHTML = '<div class="panel"><h2>Fighters</h2><p class="empty">No fighters yet - add a player to get started.</p></div>';
    return;
  }
  if (!selectedFighterId || !playerById(selectedFighterId)) selectedFighterId = players[0].id;
  var p = playerById(selectedFighterId);
  var st = fighterStats(p.id);
  var html = '<div class="panel"><h2>Fighters</h2>' +
    '<div class="pick-row"><label for="fighterSelect">Fighter</label>' +
    '<select id="fighterSelect">' +
    players.map(function (pl) {
      return '<option value="' + esc(pl.id) + '"' + (pl.id === p.id ? ' selected' : '') + '>' + esc(pl.name) + '</option>';
    }).join('') +
    '</select>';
  if (isEditor()) {
    if (st.played === 0) {
      html += '<button class="btn small danger" data-action="delete-fighter" data-player="' + esc(p.id) + '">Delete fighter</button>';
    } else {
      html += '<span class="hint">A fighter with matches cannot be deleted.</span>';
    }
  }
  html += '</div>';
  html += '<div class="stat-grid">' +
    statHtml(st.elo, 'Elo') + statHtml(st.points, 'Points') + statHtml(st.turns, 'Turns attended') +
    statHtml(st.played, 'Matches') + statHtml(st.won, 'Won') + statHtml(st.drawn, 'Drew') + statHtml(st.lost, 'Lost') +
    statHtml(st.ipFor, 'Ippon for') + statHtml(st.ipAgainst, 'Ippon against') + statHtml(st.hansoku, 'Hansoku') +
    '</div>';
  html += '<p><strong>Ippons scored by type:</strong> ' +
    esc(IPPON_TYPES.map(function (t) { return t + ': ' + st.types[t]; }).join(' · ')) + '</p>';
  if (st.awards.length) {
    html += '<p><strong>Fighting Spirit awards:</strong> ' +
      esc(st.awards.map(function (t) { return t.name; }).join(', ')) + '</p>';
  } else {
    html += '<p class="empty">No Fighting Spirit awards yet.</p>';
  }
  html += '</div>';
  var turnById = {};
  appState.turns.forEach(function (t) { turnById[t.id] = t; });
  var ms = appState.matches
    .filter(function (m) {
      if (m.whiteId !== p.id && m.redId !== p.id) return false;
      var mt = turnById[m.turnId];
      return mt && seasonIncludes(turnYear(mt));
    })
    .sort(function (a, b) {
      var da = (turnById[a.turnId] && turnById[a.turnId].date) || '';
      var db = (turnById[b.turnId] && turnById[b.turnId].date) || '';
      if (db !== da) return db.localeCompare(da);
      if (b.round !== a.round) return b.round - a.round;
      return matchNum(b.id) - matchNum(a.id);
    });
  html += '<div class="panel"><h2>Match history</h2>';
  if (!ms.length) {
    html += '<p class="empty">No matches yet.</p>';
  } else {
    ms.forEach(function (m) {
      html += matchCardHtml(m, turnById[m.turnId] || { name: 'Unknown turn' });
    });
  }
  html += '</div>';
  el.innerHTML = html;
}

/* ---------- Hall of Fame ---------- */

// The Hall of Fame for the selected season, or null if the backend did
// not return one (older deployments) or when "All time" is selected
// (awards are annual, per season).
function hallOfFame() {
  if (isAllTime()) return null;
  if (!appState || !appState.hallOfFame) return null;
  return appState.hallOfFame[String(selectedSeason)] || null;
}

function hofVisibleToViewers() {
  var hof = hallOfFame();
  return !!(hof && hof.visible);
}

// The tab is shown to editors always, and to viewers only once an
// editor has published that season's Hall of Fame. It is hidden for
// "All time" (awards are annual, per season).
function hofTabVisible() {
  if (isAllTime()) return false;
  return isEditor() || hofVisibleToViewers();
}

// Whether a player is Active in the selected season: they attended the
// latest completed turn (or everyone is Active when no turn is complete
// yet). Prefers the backend's list; falls back to the same rule computed
// from the turns and player selections the page already has.
function isPlayerActive(pid) {
  var hof = hallOfFame();
  if (hof && hof.activePlayerIds) return hof.activePlayerIds.indexOf(pid) !== -1;
  var seasonTurns = (appState.turns || []).filter(function (t) { return seasonIncludes(turnYear(t)); });
  var latestComplete = null;
  seasonTurns.forEach(function (t) {
    if (t.status === 'Complete' && (!latestComplete || (t.date || '') > (latestComplete.date || ''))) latestComplete = t;
  });
  if (!latestComplete) return true;
  return (appState.turnPlayers || []).some(function (tp) { return tp.turnId === latestComplete.id && tp.playerId === pid; });
}

function updateHofTabVisibility() {
  var btn = document.getElementById('hofTabBtn');
  if (btn) btn.hidden = !hofTabVisible();
  // If the user is on the Hall of Fame tab and it just became hidden
  // (e.g. the season changed to one that is not published), move them
  // back to the Schedule tab.
  if (currentTab === 'halloffame' && !hofTabVisible()) setTab('schedule');
}

// One award's winner names, joined, or a placeholder when unassigned.
function hofWinnerNames(award) {
  if (!award || !award.winner || !award.winner.length) return '';
  return award.winner.map(function (id) { return playerName(id); }).filter(function (n) { return !!n; }).join(', ');
}

// The editor control for one award: a player dropdown, a Set button to
// override (or pick) the winner, and a Clear button when one is stored.
// Highest Attendance can have several auto winners on a tie; the
// override picks a single winner.
function hofAwardControl(awardKey, award) {
  if (!isEditor()) return '';
  var players = appState.players.slice().sort(compareName);
  var current = award && award.override ? award.override[0] : (award && award.winner && award.winner.length ? award.winner[0] : '');
  // For a manual award the stored winner is the choice; for an auto
  // award the dropdown defaults to the current winner so the editor
  // can keep it or pick someone else.
  var html = '<div class="hof-ctrl"><select id="hof-' + awardKey + '" aria-label="Winner for ' + esc(awardKey) + '">' +
    '<option value="">Choose a player</option>' +
    players.map(function (pl) {
      return '<option value="' + esc(pl.id) + '"' + (pl.id === current ? ' selected' : '') + '>' + esc(pl.name) + (isPlayerActive(pl.id) ? '' : ' (Inactive)') + '</option>';
    }).join('') +
    '</select>' +
    '<button class="btn small" data-action="hof-set-award" data-award="' + esc(awardKey) + '">Set</button>';
  var isAuto = award && award.auto !== null && award.auto !== undefined;
  // Only a stored value gets a Clear button: an override for an auto
  // award (revert to the calculated winner), or the stored winner for
  // a manual award. An auto award with no override has nothing to clear.
  var hasStored = false;
  if (award) {
    if (isAuto) hasStored = !!(award.override && award.override.length);
    else hasStored = !!(award.winner && award.winner.length);
  }
  if (hasStored) {
    html += '<button class="btn small ghost" data-action="hof-clear-award" data-award="' + esc(awardKey) + '">' +
      (isAuto ? 'Revert to auto' : 'Clear') + '</button>';
  }
  html += '</div>';
  return html;
}

function renderHallOfFame() {
  var el = document.getElementById('tab-halloffame');
  if (!appState) { el.innerHTML = '<div class="panel"><p>Loading...</p></div>'; return; }
  var hof = hallOfFame();
  var html = '<div class="panel"><h2>Hall of Fame</h2>';
  html += '<p class="hof-note">Annual awards for the ' + selectedSeason + ' season, shared at the end of the season. ' +
    'Only Active players (attended the latest completed turn) are eligible for the automatic awards.</p>';
  if (isEditor()) {
    if (hofVisibleToViewers()) {
      html += '<p><span class="badge active">Visible to viewers</span> ' +
        '<button class="btn small" data-action="hof-toggle-visible">Hide from viewers</button></p>';
    } else {
      html += '<p><span class="badge inactive">Editors only</span> ' +
        '<button class="btn small" data-action="hof-toggle-visible">Make visible to viewers</button></p>';
    }
  }
  if (!hof || !hof.awards) {
    html += '<p class="empty">No Hall of Fame data for ' + selectedSeason + ' yet.</p></div>';
    el.innerHTML = html;
    return;
  }
  var awards = hof.awards;
  function awardCell(key, label, desc) {

    var cell = '<span class="hof-winner">' + (names ? esc(names) : '<span class="hof-detail">Not yet chosen</span>') + '</span>';
    if (a && a.detail) cell += ' <span class="hof-detail">(' + esc(a.detail) + ')</span>';
    if (a && a.override && a.override.length) cell += ' <span class="badge overridden">Overridden</span>';
    return cell;
  }
  html += '<table class="hof"><thead><tr><th>Award</th><th>Winner</th>' + (isEditor() ? '<th>Editor</th>' : '') + '</tr></thead><tbody>';
  // Points: Gold, Silver, Bronze in one row, each with its own override.
  html += '<tr><td><span class="hof-place">Points</span><br><span class="hof-detail">Gold, Silver, Bronze by points</span></td><td>' +
    ['gold', 'silver', 'bronze'].map(function (key) {
      var label = key.charAt(0).toUpperCase() + key.slice(1);
      var a = awards[key];
      var names = hofWinnerNames(a);
      var line = '<span class="hof-place">' + label + ':</span> ' +
        (names ? '<span class="hof-winner">' + esc(names) + '</span>' : '<span class="hof-detail">Not yet chosen</span>');
      if (a && a.detail) line += ' <span class="hof-detail">(' + esc(a.detail) + ')</span>';
      if (a && a.override && a.override.length) line += ' <span class="badge overridden">Overridden</span>';
      return line;
    }).join('<br>') + '</td>';
  if (isEditor()) {
    html += '<td>' + ['gold', 'silver', 'bronze'].map(function (key) { return hofAwardControl(key, awards[key]); }).join('') + '</td>';
  }
  html += '</tr>';
  // The remaining automatic awards, one row each.
  [['mostGains', 'Most Gains', 'Highest Elo'],
   ['sharpestShooter', 'Sharpest Shooter', 'Most ippons per match'],
   ['comeback', 'Comeback', 'Biggest Elo recovery (lowest to year-end)'],
   ['highestAttendance', 'Highest Attendance', 'Most turns attended']].forEach(function (row) {
    var key = row[0], label = row[1], desc = row[2];
    html += '<tr><td><span class="hof-place">' + esc(label) + '</span><br><span class="hof-detail">' + esc(desc) + '</span></td>' +
      '<td>' + awardCell(key, label, desc) + '</td>';
    if (isEditor()) html += '<td>' + hofAwardControl(key, awards[key]) + '</td>';
    html += '</tr>';
  });
  // The two manual awards.
  [['fightingSpirit', 'Fighting Spirit', 'Best embodied the virtues of kendo'],
   ['bestShinpan', 'Best Shinpan', 'Best refereeing']].forEach(function (row) {
    var key = row[0], label = row[1], desc = row[2];
    html += '<tr><td><span class="hof-place">' + esc(label) + '</span><br><span class="hof-detail">' + esc(desc) + '</span></td>' +
      '<td>' + awardCell(key, label, desc) + '</td>';
    if (isEditor()) html += '<td>' + hofAwardControl(key, awards[key]) + '</td>';
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  el.innerHTML = html;
}

/* ---------- actions ---------- */

function setTab(name) {
  // The Hall of Fame tab is only open when it is visible to this user,
  // and the Admin tab only for the admin account.
  if (name === 'halloffame' && !hofTabVisible()) name = 'schedule';
  if (name === 'admin' && !isAdmin()) name = 'schedule';
  currentTab = name;
  document.querySelectorAll('.tab').forEach(function (b) {
    b.classList.toggle('active', b.dataset.tab === name);
  });
  ['schedule', 'results', 'scoreboard', 'fighters', 'halloffame', 'admin'].forEach(function (t) {
    document.getElementById('tab-' + t).hidden = (t !== name);
  });
  if (name === 'admin') renderAdmin();
}

function readSelect(card, field) {
  var sel = card.querySelector('select[data-f="' + field + '"]');
  return sel ? parseInt(sel.value, 10) : 0;
}

function readTypeSelects(card, side) {
  var vals = [];
  var i = 0;
  var sel;
  while ((sel = card.querySelector('select[data-f="' + side + 'IpponType' + i + '"]'))) {
    vals.push(sel.value || '');
    i++;
  }
  return vals;
}

async function handleAction(action, target) {
  var turnId = target.dataset.turn;
  var rowIndex = target.dataset.row ? parseInt(target.dataset.row, 10) : null;
  var matchId = target.dataset.match;
  try {
    if (action === 'toggle-round') {
      // Local only: collapse/expand the round, no server call.
      var rkey = turnId + ':' + (target.dataset.round || '');
      collapsedRounds[rkey] = !collapsedRounds[rkey];
      render();
      return;
    } else if (action === 'delete-match') {
      if (!window.confirm('Delete this match? This cannot be undone.')) return;
      await api('deleteMatch', { matchId: matchId });
      showStatus('Match deleted.');
    } else if (action === 'delete-round') {
      var roundNum = parseInt(target.dataset.round, 10) || 0;
      if (!window.confirm('Delete Round ' + roundNum + ' (all its matches)? This cannot be undone.')) return;
      var del = await api('deleteRound', { turnId: turnId, round: roundNum });
      showStatus('Round ' + roundNum + ' deleted (' + del.deleted + ' match' + (del.deleted === 1 ? '' : 'es') + ').');
    } else if (action === 'delete-fighter') {
      var pid = target.dataset.player;
      if (!window.confirm('Delete ' + playerName(pid) + '? This cannot be undone.')) return;
      await api('deletePlayer', { playerId: pid });
      selectedFighterId = null;
      showStatus('Fighter deleted.');
    } else if (action === 'save-turn-players') {
      var ids = [];
      document.querySelectorAll('input[type="checkbox"][data-turn="' + turnId + '"]:checked')
        .forEach(function (cb) { ids.push(cb.value); });
      await api('setTurnPlayers', { turnId: turnId, playerIds: ids });
      showStatus('Players saved for this turn.');
    } else if (action === 'select-all-players' || action === 'unselect-all-players') {
      // Local only: check or uncheck every competing-player checkbox on
      // this turn. Save players still commits the choice.
      var on = action === 'select-all-players';
      document.querySelectorAll('input[type="checkbox"][data-turn="' + turnId + '"]')
        .forEach(function (cb) { cb.checked = on; });
      return;
    } else if (action === 'generate-round') {
      var gen = await api('generateRound', { turnId: turnId });
      var msg = 'Round ' + gen.round + ' generated.';
      if (gen.byes && gen.byes.length) {
        var byeNames = gen.byes.map(function (id) { return playerName(id); }).filter(function (n) { return !!n; });
        if (byeNames.length) msg += ' Sitting out: ' + byeNames.join(', ') + '.';
      }
      showStatus(msg);
    } else if (action === 'mark-complete') {
      // Toggle: a Complete turn goes back to empty, otherwise it is marked Complete.
      var turn = null;
      appState.turns.forEach(function (x) { if (x.id === turnId) turn = x; });
      var toComplete = !turn || turn.status !== 'Complete';
      await api('setTurnStatus', { turnId: turnId, status: toComplete ? 'Complete' : '' });
      showStatus(toComplete ? 'Turn marked complete.' : 'Turn unmarked (no longer complete).');
    } else if (action === 'mark-round-complete') {
      // Toggle one round: marking it locks its matches and shows them as
      // complete; unmarking reopens them. The server refuses to unmark a
      // round while its turn is complete.
      var roundNum = parseInt(target.dataset.round, 10) || 0;
      var roundComplete = false;
      (appState.matches || []).forEach(function (m) {
        if (m.turnId === turnId && m.round === roundNum && m.roundComplete) roundComplete = true;
      });
      var toRoundComplete = !roundComplete;
      await api('setRoundComplete', { turnId: turnId, round: roundNum, complete: toRoundComplete });
      showStatus(toRoundComplete ? 'Round ' + roundNum + ' marked complete.' : 'Round ' + roundNum + ' unmarked (no longer complete).');
    } else if (action === 'hof-toggle-visible') {
      // Publish (or unpublish) this season's Hall of Fame to viewers.
      var toVisible = !hofVisibleToViewers();
      await api('setHallOfFameVisible', { season: selectedSeason, visible: toVisible });
      showStatus(toVisible ? 'Hall of Fame is now visible to viewers.' : 'Hall of Fame is now editors only.');
    } else if (action === 'hof-set-award') {
      // Set the stored winner for one award: an override for an auto
      // award, or the winner for a manual award. An empty choice does
      // nothing; use the Clear button to remove a stored winner.
      var awardKey = target.dataset.award;
      var sel = document.getElementById('hof-' + awardKey);
      var pickId = sel ? sel.value : '';
      if (!pickId) { showStatus('Choose a player first.', true); return; }
      await api('setHallOfFameAward', { season: selectedSeason, award: awardKey, playerIds: [pickId] });
      showStatus('Hall of Fame award updated.');
    } else if (action === 'hof-clear-award') {
      // Remove the stored winner: an auto award reverts to its
      // calculated winner, a manual award becomes unassigned.
      var clearKey = target.dataset.award;
      await api('setHallOfFameAward', { season: selectedSeason, award: clearKey, playerIds: [] });
      showStatus('Hall of Fame award cleared.');
    } else if (action === 'open-login') {
      // Local only: open the login form from the "Login required" prompt.
      document.getElementById('loginModal').hidden = false;
      document.getElementById('loginUser').focus();
      return;
    } else if (action === 'admin-set-password') {
      // Set a login's password to the value typed in its row.
      var pwUser = target.dataset.user;
      var pwInput = document.getElementById('pw-' + pwUser);
      var newPass = pwInput ? pwInput.value.trim() : '';
      if (!newPass) { showStatus('Enter a new password first.', true); return; }
      await api('updateUser', { username: pwUser, password: newPass });
      adminUsers = null;
      showStatus('Password updated for ' + pwUser + '.');
    } else if (action === 'admin-new-password') {
      // Give a login a fresh random 10-digit password and show it.
      var rpUser = target.dataset.user;
      var rpPass = String(1000000000 + Math.floor(Math.random() * 9000000000));
      await api('updateUser', { username: rpUser, password: rpPass });
      adminUsers = null;
      showStatus('New password for ' + rpUser + ': ' + rpPass);
    } else if (action === 'admin-set-role') {
      // Change a login's role (viewer or editor).
      var roleUser = target.dataset.user;
      var roleSel = document.getElementById('role-' + roleUser);
      var newRole = roleSel ? roleSel.value : '';
      if (!newRole) return;
      await api('updateUser', { username: roleUser, role: newRole });
      adminUsers = null;
      showStatus('Role updated for ' + roleUser + ' (' + newRole + ').');
    } else if (action === 'admin-delete-user') {
      var delUser = target.dataset.user;
      if (!window.confirm('Delete the login for ' + delUser + '? This cannot be undone.')) return;
      await api('deleteUser', { username: delUser });
      adminUsers = null;
      showStatus('Login deleted for ' + delUser + '.');
    } else if (action === 'admin-create-user') {
      // Create a login. A blank password means the server generates a
      // random 10-digit one and returns it.
      var newName = document.getElementById('new-user-name');
      var newPassInput = document.getElementById('new-user-pass');
      var newRoleSel = document.getElementById('new-user-role');
      var uname = newName ? newName.value.trim() : '';
      if (!uname) { showStatus('Enter a username first.', true); return; }
      var created = await api('createUser', {
        username: uname,
        password: newPassInput ? newPassInput.value.trim() : '',
        role: newRoleSel ? newRoleSel.value : 'viewer'
      });
      adminUsers = null;
      showStatus('User created: ' + created.user.username + ' / ' + created.user.password + ' (' + created.user.role + ').');
    } else if (action === 'add-fighting-spirit') {
      var fsAdd = document.getElementById('fs-add-' + turnId);
      var addId = fsAdd ? fsAdd.value : '';
      if (!addId) return;
      var turn = null;
      appState.turns.forEach(function (x) { if (x.id === turnId) turn = x; });
      var ids = turn ? (turn.fightingSpirit || []).slice() : [];
      if (ids.indexOf(addId) === -1) ids.push(addId);
      await api('setFightingSpirit', { turnId: turnId, playerIds: ids });
      showStatus('Fighting Spirit award added.');
    } else if (action === 'remove-fighting-spirit') {
      var remId = target.dataset.player;
      var turn2 = null;
      appState.turns.forEach(function (x) { if (x.id === turnId) turn2 = x; });
      var ids2 = turn2 ? (turn2.fightingSpirit || []).filter(function (x) { return x !== remId; }) : [];
      await api('setFightingSpirit', { turnId: turnId, playerIds: ids2 });
      showStatus('Fighting Spirit award removed.');
    } else if (action === 'edit-turn-date') {
      editingTurnDate = turnId;
      render();
      return;
    } else if (action === 'cancel-turn-date') {
      editingTurnDate = null;
      render();
      return;
    } else if (action === 'save-turn-date') {
      var newDate = document.getElementById('te-date-' + turnId).value;
      await api('updateTurnDate', { turnId: turnId, date: newDate });
      editingTurnDate = null;
      showStatus('Turn date updated.');
    } else if (action === 'delete-turn') {
      if (!window.confirm('Delete this turn, with all its matches and player selections? This cannot be undone.')) return;
      await api('deleteTurn', { turnId: turnId });
      editingTurnDate = null;
      showStatus('Turn deleted.');
    } else {
      return;
    }
    await fetchState();
  } catch (err) {
    showStatus(err.message || 'Something went wrong. Please try again.', true);
    if (target) target.disabled = false;
  }
}

document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-action]');
  if (!t) return;
  handleAction(t.dataset.action, t);
});

function readPlayerSelect(card, field) {
  var sel = card.querySelector('select[data-f="' + field + '"]');
  return sel ? sel.value : '';
}

// Save the match on this card. The ippon count per side is the number
// of filled type dropdowns, and the types are the filled values. The
// result feeds into the scoreboard and Elo only once its round (or the
// turn) is marked complete; until then it is recorded but not counted.
// No full refresh here: the score is already updated in place, and the
// 15-second poll picks up the new state without wiping the form the
// recorder is using.
async function saveMatchCard(card) {
  var matchId = card.dataset.match;
  var wTypes = readTypeSelects(card, 'white').filter(function (t) { return t; });
  var rTypes = readTypeSelects(card, 'red').filter(function (t) { return t; });
  try {
    await api('recordMatch', {
      matchId: matchId,
      whiteIppon: wTypes.length,
      redIppon: rTypes.length,
      whiteHansoku: readSelect(card, 'whiteHansoku'),
      redHansoku: readSelect(card, 'redHansoku'),
      whiteIpponTypes: wTypes,
      redIpponTypes: rTypes
    });
    showStatus('Score saved.');
  } catch (err) {
    showStatus(err.message || 'Could not save the score.', true);
  }
}

async function saveMatchPlayers(card) {
  var matchId = card.dataset.match;
  try {
    await api('updateMatchPlayers', {
      matchId: matchId,
      whitePlayerId: readPlayerSelect(card, 'whitePlayer'),
      redPlayerId: readPlayerSelect(card, 'redPlayer')
    });
    showStatus('Fighters updated.');
  } catch (err) {
    showStatus(err.message || 'Could not update the fighters.', true);
    // The pairing was rejected (e.g. the same fighter on both sides):
    // reload the saved state so the selects show the real pairing.
    await fetchState();
  }
}

// Debounce the auto-save so rapid successive changes (e.g. ippon then a
// type) coalesce into one save with the latest values.
function scheduleSave(card, kind) {
  var matchId = card.dataset.match;
  if (saveTimers[matchId]) clearTimeout(saveTimers[matchId]);
  saveTimers[matchId] = setTimeout(function () {
    delete saveTimers[matchId];
    if (kind === 'players') saveMatchPlayers(card);
    else saveMatchCard(card);
  }, 400);
}

// Dropdown changes: fighter picker, results turn picker, season picker,
// and the match-card dropdowns, which save automatically.
document.addEventListener('change', function (e) {
  var sel = e.target;
  if (!sel || sel.tagName !== 'SELECT') return;
  if (sel.id === 'seasonSelect') {
    selectedSeason = sel.value === 'all' ? 'all' : (parseInt(sel.value, 10) || 2027);
    try { localStorage.setItem('dsl_season', String(selectedSeason)); } catch (err) {}
    selectedResultsTurnId = null;
    render();
    return;
  }
  if (sel.id === 'fighterSelect') {
    selectedFighterId = sel.value;
    renderFighters();
    return;
  }
  if (sel.id === 'resultsTurnSelect') {
    selectedResultsTurnId = sel.value;
    render();
    return;
  }
  var f = sel.getAttribute('data-f');
  var card = sel.closest('.match');
  if (!card) return;
  // An ippon type changed: the score is the count of filled type
  // dropdowns per side, so update it in place, then save.
  if (f.indexOf('IpponType') !== -1) {
    var score = card.querySelector('.score');
    if (score) {
      var w = readTypeSelects(card, 'white').filter(function (t) { return t; }).length;
      var r = readTypeSelects(card, 'red').filter(function (t) { return t; }).length;
      score.textContent = w + ' - ' + r;
    }
    scheduleSave(card, 'result');
    return;
  }
  // Hansoku changed: save the match as-is.
  if (f === 'whiteHansoku' || f === 'redHansoku') {
    scheduleSave(card, 'result');
    return;
  }
  // A fighter changed: save the new pairing.
  if (f === 'whitePlayer' || f === 'redPlayer') {
    scheduleSave(card, 'players');
    return;
  }
});

document.addEventListener('submit', async function (e) {
  if (e.target.id === 'createPlayerForm') {
    e.preventDefault();
    var firstName = document.getElementById('npFirst').value.trim();
    var lastName = document.getElementById('npLast').value.trim();
    if (!firstName || !lastName) return;
    try {
      var created = await api('createPlayer', { firstName: firstName, lastName: lastName });
      // A login is created automatically for the new fighter; show it
      // so it can be shared with them.
      var loginMsg = 'Player added.';
      if (created.login) loginMsg += ' Login: ' + created.login.username + ' / ' + created.login.password + ' (viewer).';
      showStatus(loginMsg);
      await fetchState();
    } catch (err) {
      showStatus(err.message || 'Could not add the player.', true);
    }
  } else if (e.target.id === 'createTurnForm') {
    e.preventDefault();
    var tdate = document.getElementById('ntDate').value;
    if (!tdate) return;
    try {
      await api('createTurn', { date: tdate });
      // A turn belongs to the year of its date: switch the view to
      // that season so the turn just created is visible.
      var y = parseInt(String(tdate).substring(0, 4), 10);
      if (y && availableSeasons().indexOf(y) >= 0 && y !== selectedSeason) {
        selectedSeason = y;
        try { localStorage.setItem('dsl_season', String(y)); } catch (err) {}
        selectedResultsTurnId = null;
      }
      showStatus('Turn created.');
      await fetchState();
    } catch (err) {
      showStatus(err.message || 'Could not create the turn.', true);
    }
  } else if (e.target.id === 'createSeasonForm') {
    e.preventDefault();
    var nsYear = parseInt(document.getElementById('nsYear').value, 10);
    if (!nsYear) return;
    try {
      await api('addSeason', { year: nsYear });
      selectedSeason = nsYear;
      try { localStorage.setItem('dsl_season', String(nsYear)); } catch (err) {}
      selectedResultsTurnId = null;
      showStatus(nsYear + ' season added.');
      await fetchState();
    } catch (err) {
      showStatus(err.message || 'Could not add the season.', true);
    }
  } else if (e.target.id === 'loginForm') {
    e.preventDefault();
    var user = document.getElementById('loginUser').value.trim();
    var pass = document.getElementById('loginPass').value;
    var errEl = document.getElementById('loginError');
    try {
      var res = await fetch(WEBAPP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'login', username: user, password: pass })
      });
      var data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Login failed.');
      // The server returns a session token; store it (not the password)
      // and use it for every request from now on.
      sessionToken = data.token;
      currentUser = { username: data.username, role: data.role, name: data.name };
      adminUsers = null;
      try { localStorage.setItem('dsl_token', sessionToken); } catch (err) { /* private mode */ }
      document.getElementById('loginModal').hidden = true;
      errEl.hidden = true;
      showStatus('Logged in as ' + (data.name || data.username) + '.');
      await fetchState();
    } catch (err) {
      errEl.textContent = err.message || 'Login failed.';
      errEl.hidden = false;
    }
  }
});

/* ---------- login / logout / tabs ---------- */

document.getElementById('loginBtn').addEventListener('click', function () {
  document.getElementById('loginModal').hidden = false;
  document.getElementById('loginUser').focus();
});

document.getElementById('loginCancel').addEventListener('click', function () {
  document.getElementById('loginModal').hidden = true;
  document.getElementById('loginError').hidden = true;
});

document.getElementById('logoutBtn').addEventListener('click', async function () {
  if (sessionToken) {
    try {
      await fetch(WEBAPP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'logout', token: sessionToken })
      });
    } catch (err) { /* the session ends locally either way */ }
  }
  sessionToken = null;
  currentUser = null;
  adminUsers = null;
  appState = null;
  try { localStorage.removeItem('dsl_token'); } catch (err) { /* private mode */ }
  showStatus('Logged out.');
  render();
  document.getElementById('loginModal').hidden = false;
});

document.querySelectorAll('.tab').forEach(function (b) {
  b.addEventListener('click', function () { setTab(b.dataset.tab); });
});

document.getElementById('toTopBtn').addEventListener('click', function () {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

window.addEventListener('scroll', function () {
  document.getElementById('toTopBtn').hidden = window.scrollY < 300;
});

/* ---------- polling ---------- */

setInterval(function () {
  if (document.visibilityState !== 'visible') return;
  // Do not wipe a form the editor is using.
  var active = document.activeElement;
  if (active && (active.tagName === 'SELECT' || active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return;
  if (editingTurnDate !== null) return;
  if (!document.getElementById('loginModal').hidden) return;
  fetchState();
}, 15000);

document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible') fetchState();
});

/* ---------- start ---------- */

// The token (if any) is already read from localStorage above; fetchState
// validates it and opens the login form when there is none or it is gone.
fetchState();
</script>
