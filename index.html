<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dublin Shiai League 2027</title>
<style>
  :root {
    --navy: #16365c;
    --royal: #1f4e79;
    --royal-light: #2e6da4;
    --ink: #1a2a3a;
    --muted: #5b7a99;
    --panel: #eef3f8;
    --line: #dbe7f3;
    --bg: #f4f7fb;
    --red-side: #fdeeee;
    --red-ink: #7a1f1f;
    --hansoku: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.45;
  }
  header { background: var(--navy); color: #fff; }
  .head-inner {
    max-width: 920px;
    margin: 0 auto;
    padding: 20px 16px 12px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
  }
  header h1 { margin: 0; font-size: 28px; line-height: 1.2; }
  header .season { margin: 2px 0 0; font-size: 16px; color: #bcd3e8; }
  .head-right { text-align: right; flex-shrink: 0; }
  #loginState { display: block; font-size: 13px; color: #bcd3e8; margin-bottom: 6px; }
  nav.tabs {
    max-width: 920px;
    margin: 0 auto;
    padding: 0 16px;
    display: flex;
    gap: 4px;
  }
  .tab {
    background: none;
    border: none;
    border-bottom: 3px solid transparent;
    color: #bcd3e8;
    font-size: 16px;
    padding: 10px 18px;
    cursor: pointer;
  }
  .tab:hover { color: #fff; }
  .tab.active { color: #fff; border-bottom-color: #fff; font-weight: 700; }
  main { max-width: 920px; margin: 0 auto; padding: 16px; }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 28px 16px 32px;
  }
  .btn {
    background: var(--royal);
    color: #fff;
    border: 1px solid var(--royal);
    border-radius: 4px;
    padding: 8px 14px;
    font-size: 14px;
    cursor: pointer;
  }
  .btn:hover { background: var(--royal-light); }
  .btn.light {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.55);
  }
  .btn.light:hover { background: rgba(255, 255, 255, 0.25); }
  .btn.ghost { background: #fff; color: var(--royal); }
  .btn.small { padding: 5px 10px; font-size: 13px; }
  .btn:disabled { opacity: 0.55; cursor: default; }
  .status {
    background: #e3eefb;
    color: var(--navy);
    border-radius: 4px;
    padding: 10px 12px;
    margin-bottom: 14px;
    font-size: 14px;
  }
  .status.error { background: #fdeeee; color: var(--red-ink); }
  .panel {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .panel h2 { margin: 0 0 10px; font-size: 19px; color: var(--navy); }
  .panel h3 { margin: 14px 0 8px; font-size: 15px; color: var(--navy); }
  .panel p { margin: 6px 0; }
  .empty { color: var(--muted); }
  /* Schedule */
  .sched-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 4px;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .sched-row:last-child { border-bottom: none; }
  .sched-date { font-weight: 700; min-width: 150px; color: var(--navy); }
  .sched-label { flex: 1; min-width: 120px; }
  .sched-notes { color: var(--muted); font-size: 13px; width: 100%; }
  .badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    border-radius: 999px;
    padding: 3px 10px;
    white-space: nowrap;
  }
  .badge.provisional { background: #e3eefb; color: var(--royal); border: 1px solid var(--royal); }
  .badge.confirmed { background: var(--royal); color: #fff; }
  .badge.upcoming { background: #e3eefb; color: var(--royal); }
  .badge.active { background: var(--royal); color: #fff; }
  .badge.complete { background: #e8edf1; color: var(--muted); }
  .sched-edit { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; width: 100%; }
  .sched-edit input, .sched-edit select { padding: 6px 8px; }
  /* Turns and matches */
  .turn-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    flex-wrap: wrap;
  }
  .turn-head h2 { margin: 0; }
  .turn-date { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .players-line { font-size: 14px; color: var(--muted); margin: 10px 0 4px; }
  .round-head {
    font-size: 15px;
    font-weight: 700;
    color: var(--navy);
    margin: 18px 0 8px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
  }
  .match {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    background: var(--panel);
    color: var(--muted);
    font-size: 13px;
    padding: 7px 12px;
  }
  .pill {
    display: inline-block;
    background: var(--royal);
    color: #fff;
    border-radius: 999px;
    padding: 2px 10px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
  }
  .pill.hidden { visibility: hidden; }
  .fight {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: stretch;
    min-height: 62px;
  }
  .side {
    display: flex;
    align-items: center;
    padding: 12px 14px;
    font-size: 18px;
    font-weight: 600;
  }
  .side.white { background: #fff; justify-content: flex-end; text-align: right; }
  .side.red { background: var(--red-side); color: var(--red-ink); justify-content: flex-start; text-align: left; }
  .centre {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 0 10px;
  }
  .score { font-size: 21px; font-weight: 700; min-width: 62px; text-align: center; }
  .slot {
    width: 18px;
    text-align: center;
    font-size: 15px;
    visibility: hidden;
  }
  .slot.on { visibility: visible; }
  .slot.ippon { color: var(--navy); }
  .slot.hansoku { color: var(--hansoku); }
  .hcount { font-size: 11px; font-weight: 700; vertical-align: super; }
  .editrow {
    border-top: 1px solid var(--line);
    background: #f7fafc;
    padding: 10px 12px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }
  .editrow label { font-size: 13px; color: var(--muted); }
  .hint { font-size: 12px; color: var(--muted); }
  .editrow select { margin-left: 4px; }
  select, input[type="text"], input[type="date"] {
    padding: 6px 8px;
    border: 1px solid #b9c9d8;
    border-radius: 4px;
    font-size: 14px;
    background: #fff;
  }
  /* Admin */
  .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 640px) { .admin-grid { grid-template-columns: 1fr; } }
  .admin-grid form { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .admin-grid input { width: 100%; }
  .turn-admin {
    border-top: 1px solid var(--line);
    margin-top: 14px;
    padding-top: 6px;
  }
  .plist {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
    margin: 6px 0 12px;
  }
  .plist label { font-size: 14px; }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btnrow select { padding: 6px 8px; }
  /* Scoreboard */
  table.scoreboard { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.scoreboard th {
    background: var(--navy);
    color: #fff;
    text-align: right;
    padding: 9px 8px;
    white-space: nowrap;
  }
  table.scoreboard th:first-child, table.scoreboard td:first-child { text-align: center; }
  table.scoreboard th:nth-child(2), table.scoreboard td:nth-child(2) { text-align: left; }
  table.scoreboard td { padding: 8px; text-align: right; border-bottom: 1px solid var(--line); }
  table.scoreboard tr:nth-child(even) td { background: var(--bg); }
  .updated { color: var(--muted); font-size: 13px; margin-top: 10px; }
  /* Fighters */
  .btn.danger { background: #c0392b; border-color: #c0392b; }
  .btn.danger:hover { background: #a93226; }
  .pick-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 10px;
    margin: 14px 0;
  }
  .stat { background: var(--panel); border-radius: 6px; padding: 10px 12px; }
  .stat .num { font-size: 22px; font-weight: 700; color: var(--navy); }
  .stat .lbl { font-size: 12px; color: var(--muted); }
  .types-line {
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    padding: 6px 12px 10px;
    border-top: 1px solid var(--line);
  }
  .to-top {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 20;
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(22, 54, 92, 0.35);
  }
  .to-top[hidden] { display: none; }
  /* Login modal */
  .modal[hidden] { display: none; }
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(22, 54, 92, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 10;
  }
  .modal-card {
    background: #fff;
    border-radius: 8px;
    padding: 22px;
    width: 100%;
    max-width: 360px;
  }
  .modal-card h2 { margin: 0 0 12px; color: var(--navy); font-size: 20px; }
  .modal-card form { display: flex; flex-direction: column; gap: 10px; }
  .modal-card label { font-size: 14px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
  .error { color: var(--red-ink); font-size: 14px; margin: 0; }
</style>
</head>
<body>
<header>
  <div class="head-inner">
    <div>
      <h1>Dublin Shiai League</h1>
      <p class="season">2027 season</p>
    </div>
    <div class="head-right">
      <span id="loginState"></span>
      <button id="loginBtn" class="btn light">Editor login</button>
      <button id="logoutBtn" class="btn light" hidden>Log out</button>
    </div>
  </div>
  <nav class="tabs">
    <button class="tab active" data-tab="schedule">Schedule</button>
    <button class="tab" data-tab="results">Results</button>
    <button class="tab" data-tab="scoreboard">Scoreboard</button>
    <button class="tab" data-tab="fighters">Fighters</button>
  </nav>
</header>

<main>
  <div id="statusLine" class="status" hidden></div>
  <section id="tab-schedule" class="tabpage"></section>
  <section id="tab-results" class="tabpage" hidden></section>
  <section id="tab-scoreboard" class="tabpage" hidden></section>
  <section id="tab-fighters" class="tabpage" hidden></section>
</main>

<footer>Dublin Kendo Kobukai · Dublin Shiai League 2027</footer>

<button id="toTopBtn" class="to-top" hidden>↑ Top</button>

<div id="loginModal" class="modal" hidden>
  <div class="modal-card">
    <h2>Editor login</h2>
    <form id="loginForm">
      <label>Username
        <input id="loginUser" type="text" autocomplete="username" required>
      </label>
      <label>Password
        <input id="loginPass" type="password" autocomplete="current-password" required>
      </label>
      <p id="loginError" class="error" hidden></p>
      <div>
        <button class="btn" type="submit">Log in</button>
        <button class="btn ghost" type="button" id="loginCancel">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script>
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxLDxB_UVzAxepjPToFO78-atoZZcFGfbSZX0bzr6IOyAuXZNuAfqkPpeO6lrSDYZWO/exec";

var appState = null;
var editorCreds = null;
var currentTab = 'schedule';
var editingTurnDate = null;
var statusTimer = null;

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function isEditor() {
  return !!editorCreds;
}

function showStatus(msg, isError) {
  var el = document.getElementById('statusLine');
  el.textContent = msg;
  el.classList.toggle('error', !!isError);
  el.hidden = false;
  if (statusTimer) clearTimeout(statusTimer);
  statusTimer = setTimeout(function () { el.hidden = true; }, 6000);
}

// '2027-01-29' -> 'Fri 29 Jan 2027'. Parsed as a local date to avoid shifts.
function fmtDate(iso) {
  if (!iso) return 'Date to be confirmed';
  var parts = String(iso).split('-');
  if (parts.length !== 3) return iso;
  var d = new Date(+parts[0], +parts[1] - 1, +parts[2]);
  if (isNaN(d.getTime())) return iso;
  return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
}

function matchNum(matchId) {
  var m = /-M(\d+)$/.exec(matchId || '');
  return m ? parseInt(m[1], 10) : 0;
}

function playerById(id) {
  if (!appState) return null;
  for (var i = 0; i < appState.players.length; i++) {
    if (appState.players[i].id === id) return appState.players[i];
  }
  return null;
}

function playerName(id) {
  var p = playerById(id);
  return p ? p.name : 'Unknown player';
}

/* ---------- data access ---------- */

async function fetchState() {
  if (!WEBAPP_URL) {
    showStatus('Add the Apps Script web app URL to WEBAPP_URL in index.html.', true);
    return;
  }
  try {
    var res = await fetch(WEBAPP_URL + '?action=getState');
    var data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Could not load the league data.');
    appState = data;
    render();
  } catch (err) {
    showStatus('Could not load the league data. Please try again later.', true);
  }
}

async function api(action, payload) {
  var body = { action: action };
  if (editorCreds) {
    body.username = editorCreds.username;
    body.password = editorCreds.password;
  }
  if (payload) {
    for (var k in payload) body[k] = payload[k];
  }
  var res = await fetch(WEBAPP_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  });
  var data = await res.json();
  if (!data.ok) throw new Error(data.error || 'Request failed.');
  return data;
}

/* ---------- rendering ---------- */

function render() {
  var y = window.scrollY;
  renderSchedule();
  renderResults();
  renderScoreboard();
  renderFighters();
  updateAuthUI();
  window.scrollTo(0, y);
}

function updateAuthUI() {
  document.getElementById('loginBtn').hidden = isEditor();
  document.getElementById('logoutBtn').hidden = !isEditor();
  document.getElementById('loginState').textContent =
    isEditor() ? 'Logged in as ' + editorCreds.username : '';
}

function renderSchedule() {
  var el = document.getElementById('tab-schedule');
  if (!appState) { el.innerHTML = '<div class="panel"><p>Loading...</p></div>'; return; }
  // The schedule IS the turns: each turn takes its name from its date.
  var turns = appState.turns.slice().sort(function (a, b) {
    return (a.date || '').localeCompare(b.date || '');
  });
  if (!turns.length) {
    el.innerHTML = '<div class="panel"><p class="empty">No league dates yet.</p></div>';
    return;
  }
  var html = '<div class="panel"><h2>League dates</h2>';
  turns.forEach(function (t) {
    html += '<div class="sched-row">' +
      '<span class="sched-date">' + esc(t.name) + '</span>';
    if (t.playerCount > 0) {
      html += '<span class="sched-label">' + t.playerCount + (t.playerCount === 1 ? ' player' : ' players') + '</span>';
    }
    if (t.fightingSpiritName) {
      html += '<span class="sched-notes">Fighting Spirit: ' + esc(t.fightingSpiritName) + '</span>';
    }
    if (isEditor()) {
      if (editingTurnDate === t.id) {
        html += '<div class="sched-edit">' +
          '<input type="date" id="te-date-' + esc(t.id) + '" value="' + esc(t.date) + '">' +
          '<button class="btn small" data-action="save-turn-date" data-turn="' + esc(t.id) + '">Save</button>' +
          '<button class="btn small ghost" data-action="cancel-turn-date">Cancel</button>' +
        '</div>';
      } else {
        html += '<button class="btn small ghost" data-action="edit-turn-date" data-turn="' + esc(t.id) + '">Edit date</button>';
      }
    }
    html += '</div>';
  });
  html += '</div>';
  el.innerHTML = html;
}

function ipponSlot(count, n) {
  return '<span class="slot ippon' + (count >= n ? ' on' : '') + '">●</span>';
}

function hansokuSlot(count) {
  if (count <= 0) return '<span class="slot hansoku">▲</span>';
  return '<span class="slot hansoku on">▲' + (count > 1 ? '<span class="hcount">' + count + '</span>' : '') + '</span>';
}

function centreHtml(m) {
  // Outside to inside: hansoku, first ippon, second ippon, score, second ippon, first ippon, hansoku.
  return hansokuSlot(m.whiteHansoku) +
    ipponSlot(m.whiteIppon, 1) + ipponSlot(m.whiteIppon, 2) +
    '<span class="score">' + m.whiteIppon + ' - ' + m.redIppon + '</span>' +
    ipponSlot(m.redIppon, 2) + ipponSlot(m.redIppon, 1) +
    hansokuSlot(m.redHansoku);
}

function ipponOptions(v) {
  var html = '';
  [0, 1, 2].forEach(function (n) {
    html += '<option value="' + n + '"' + (v === n ? ' selected' : '') + '>' + n + '</option>';
  });
  return html;
}

var IPPON_TYPES = ['Men', 'Kote', 'Do', 'Tsuki', 'Hansoku'];

function ipponTypeOptions(v) {
  var html = '<option value="">Type</option>';
  IPPON_TYPES.forEach(function (t) {
    html += '<option value="' + t + '"' + (v === t ? ' selected' : '') + '>' + t + '</option>';
  });
  return html;
}

// One type dropdown per ippon scored by this side (none when the count is 0).
function typeSelectsHtml(m, side) {
  var count = side === 'white' ? m.whiteIppon : m.redIppon;
  var types = side === 'white' ? (m.whiteIpponTypes || []) : (m.redIpponTypes || []);
  var html = '';
  for (var i = 0; i < count; i++) {
    html += '<select data-f="' + side + 'IpponType' + i + '">' + ipponTypeOptions(types[i] || '') + '</select>';
  }
  return html;
}

function matchCardHtml(m, turn) {
  var meta = esc(turn.name) + ' · Round ' + m.round + ' · Match ' + matchNum(m.id);
  var pill = '<span class="pill' + (m.completed ? '' : ' hidden') + '">Completed</span>';
  var html = '<div class="match" data-match="' + esc(m.id) + '">' +
    '<div class="meta"><span>' + meta + '</span>' + pill + '</div>' +
    '<div class="fight">' +
      '<div class="side white"><span>' + esc(playerName(m.whiteId)) + '</span></div>' +
      '<div class="centre">' + centreHtml(m) + '</div>' +
      '<div class="side red"><span>' + esc(playerName(m.redId)) + '</span></div>' +
    '</div>';
  var wt = (m.whiteIpponTypes || []).filter(function (t) { return t; });
  var rt = (m.redIpponTypes || []).filter(function (t) { return t; });
  var typeParts = [];
  if (wt.length) typeParts.push('White: ' + wt.join(', '));
  if (rt.length) typeParts.push('Red: ' + rt.join(', '));
  if (typeParts.length) {
    html += '<div class="types-line">' + esc(typeParts.join(' · ')) + '</div>';
  }
  if (isEditor()) {
    html += '<div class="editrow">' +
      '<label>White ippon <select data-f="whiteIppon">' + ipponOptions(m.whiteIppon) + '</select>' +
      '<span data-types="white">' + typeSelectsHtml(m, 'white') + '</span></label>' +
      '<label>Red ippon <select data-f="redIppon">' + ipponOptions(m.redIppon) + '</select>' +
      '<span data-types="red">' + typeSelectsHtml(m, 'red') + '</span></label>' +
      '<label>White hansoku <select data-f="whiteHansoku">' + ipponOptions(m.whiteHansoku) + '</select></label>' +
      '<label>Red hansoku <select data-f="redHansoku">' + ipponOptions(m.redHansoku) + '</select></label>' +
      '<button class="btn small" data-action="save-match" data-match="' + esc(m.id) + '">Save</button>' +
      '<span class="hint">Hansoku is recorded only. Adjust the ippons manually when a hansoku earns an ippon.</span>' +
    '</div>';
  }
  html += '</div>';
  return html;
}

function turnPlayersHtml(turnId) {
  var ids = appState.turnPlayers
    .filter(function (tp) { return tp.turnId === turnId; })
    .map(function (tp) { return tp.playerId; });
  if (!ids.length) return '<p class="players-line">No players selected for this turn yet.</p>';
  var names = ids.map(function (id) {
    var p = playerById(id);
    return p ? esc(p.name) : 'Unknown player';
  });
  return '<p class="players-line">Competing: ' + names.join(', ') + '</p>';
}

function turnAdminHtml(t) {
  var selected = {};
  appState.turnPlayers.forEach(function (tp) {
    if (tp.turnId === t.id) selected[tp.playerId] = true;
  });
  var html = '<div class="turn-admin"><h3>Competing players</h3><div class="plist">';
  appState.players.forEach(function (p) {
    html += '<label><input type="checkbox" data-turn="' + esc(t.id) + '" value="' + esc(p.id) + '"' +
      (selected[p.id] ? ' checked' : '') + '> ' + esc(p.name) + '</label>';
  });
  if (!appState.players.length) html += '<span class="empty">No players yet. Add a player above first.</span>';
  html += '</div><div class="btnrow">' +
    '<button class="btn" data-action="save-turn-players" data-turn="' + esc(t.id) + '">Save players</button>' +
    '<button class="btn" data-action="generate-round" data-turn="' + esc(t.id) + '">Generate next round</button>' +
    '<select id="status-' + esc(t.id) + '">' +
      ['Upcoming', 'Active', 'Complete'].map(function (s) {
        return '<option value="' + s + '"' + (t.status === s ? ' selected' : '') + '>' + s + '</option>';
      }).join('') +
    '</select>' +
    '<button class="btn" data-action="set-status" data-turn="' + esc(t.id) + '">Update status</button>' +
    '<button class="btn" data-action="mark-complete" data-turn="' + esc(t.id) + '">Mark complete</button>' +
  '</div>';
  var competing = appState.players.filter(function (p) { return selected[p.id]; });
  html += '<h3>Fighting Spirit award</h3><div class="btnrow">';
  if (!competing.length) {
    html += '<span class="empty">Select the competing players above first.</span>';
  } else {
    html += '<select id="fs-' + esc(t.id) + '">' +
      '<option value="">No winner yet</option>' +
      competing.map(function (p) {
        return '<option value="' + esc(p.id) + '"' + (t.fightingSpirit === p.id ? ' selected' : '') + '>' + esc(p.name) + '</option>';
      }).join('') +
    '</select>' +
    '<button class="btn" data-action="save-fighting-spirit" data-turn="' + esc(t.id) + '">Save winner</button>';
  }
  html += '</div></div>';
  return html;
}

var selectedResultsTurnId = null;

function turnPanelHtml(t) {
  var badge = t.status === 'Active' ? 'active' : (t.status === 'Complete' ? 'complete' : 'upcoming');
  var meta = [];
  if (t.playerCount > 0) meta.push(t.playerCount + (t.playerCount === 1 ? ' player' : ' players'));
  if (t.fightingSpiritName) meta.push('Fighting Spirit: ' + t.fightingSpiritName);
  var html = '<div class="panel"><div class="turn-head"><div>' +
    '<h2>' + esc(t.name) + '</h2>' +
    (meta.length ? '<div class="turn-date">' + esc(meta.join(' · ')) + '</div>' : '') +
    '</div><span class="badge ' + badge + '">' + esc(t.status) + '</span></div>';
  html += turnPlayersHtml(t.id);
  var ms = appState.matches
    .filter(function (m) { return m.turnId === t.id; })
    .sort(function (a, b) {
      if (a.round !== b.round) return a.round - b.round;
      return matchNum(a.id) - matchNum(b.id);
    });
  if (!ms.length) {
    html += '<p class="empty">No matches yet - generate the first round.</p>';
  } else {
    var currentRound = null;
    ms.forEach(function (m) {
      if (m.round !== currentRound) {
        currentRound = m.round;
        html += '<div class="round-head">Round ' + m.round + '</div>';
      }
      html += matchCardHtml(m, t);
    });
  }
  if (isEditor()) html += turnAdminHtml(t);
  html += '</div>';
  return html;
}

function renderResults() {
  var el = document.getElementById('tab-results');
  if (!appState) { el.innerHTML = '<div class="panel"><p>Loading...</p></div>'; return; }
  var html = '';
  if (isEditor()) {
    html += '<div class="panel"><h2>Editor panel</h2><div class="admin-grid">' +
      '<div><h3>Add a player</h3><form id="createPlayerForm">' +
        '<input type="text" id="npFirst" placeholder="First name" required>' +
        '<input type="text" id="npLast" placeholder="Last name" required>' +
        '<button class="btn" type="submit">Add player</button>' +
      '</form></div>' +
      '<div><h3>Create a turn</h3><form id="createTurnForm">' +
        '<input type="date" id="ntDate" required>' +
        '<button class="btn" type="submit">Create turn</button>' +
        '<p class="hint">The turn takes its name from its date.</p>' +
      '</form></div>' +
    '</div></div>';
  }
  // One turn at a time, picked from the dropdown. Most recent first;
  // the Active turn is the default when there is one.
  var turns = appState.turns.slice().sort(function (a, b) {
    return (b.date || '').localeCompare(a.date || '');
  });
  if (!turns.length) {
    html += '<div class="panel"><p class="empty">No turns yet - create the first turn to get started.</p></div>';
    el.innerHTML = html;
    return;
  }
  if (!selectedResultsTurnId || !turns.some(function (t) { return t.id === selectedResultsTurnId; })) {
    var active = null;
    for (var i = 0; i < turns.length; i++) {
      if (turns[i].status === 'Active') { active = turns[i]; break; }
    }
    selectedResultsTurnId = active ? active.id : turns[0].id;
  }
  var t = null;
  turns.forEach(function (x) { if (x.id === selectedResultsTurnId) t = x; });
  html += '<div class="panel"><div class="pick-row"><label for="resultsTurnSelect">Turn</label>' +
    '<select id="resultsTurnSelect">' +
    turns.map(function (x) {
      return '<option value="' + esc(x.id) + '"' + (x.id === t.id ? ' selected' : '') + '>' + esc(x.name) + '</option>';
    }).join('') +
    '</select></div></div>';
  html += turnPanelHtml(t);
  el.innerHTML = html;
}

function scoreboardRows() {
  var s = appState.settings;
  var rows = appState.players.map(function (p) {
    return {
      id: p.id, name: p.name, elo: p.elo,
      played: 0, won: 0, drawn: 0, lost: 0, ipFor: 0, ipAgainst: 0, points: 0
    };
  });
  var byId = {};
  rows.forEach(function (r) { byId[r.id] = r; });
  appState.matches.forEach(function (m) {
    if (!m.completed) return;
    var w = byId[m.whiteId];
    var r = byId[m.redId];
    if (!w || !r) return;
    w.played++;
    r.played++;
    w.ipFor += m.whiteIppon;
    w.ipAgainst += m.redIppon;
    r.ipFor += m.redIppon;
    r.ipAgainst += m.whiteIppon;
    if (m.result === 'White') {
      w.won++; r.lost++;
      w.points += s.winPoints; r.points += s.lossPoints;
    } else if (m.result === 'Red') {
      r.won++; w.lost++;
      r.points += s.winPoints; w.points += s.lossPoints;
    } else if (m.result === 'Draw') {
      w.drawn++; r.drawn++;
      w.points += s.drawPoints; r.points += s.drawPoints;
    }
  });
  rows.sort(function (a, b) {
    if (b.points !== a.points) return b.points - a.points;
    if (b.ipFor !== a.ipFor) return b.ipFor - a.ipFor;
    if (b.elo !== a.elo) return b.elo - a.elo;
    return a.name.localeCompare(b.name);
  });
  return rows;
}

function renderScoreboard() {
  var el = document.getElementById('tab-scoreboard');
  if (!appState) { el.innerHTML = '<div class="panel"><p>Loading...</p></div>'; return; }
  var rows = scoreboardRows();
  var html = '<div class="panel"><h2>Scoreboard</h2>';
  if (!rows.length) {
    html += '<p class="empty">No players yet - add a player to get started.</p>';
  } else {
    html += '<table class="scoreboard"><thead><tr>' +
      '<th>Rank</th><th>Name</th><th>Elo</th><th>Played</th><th>Won</th><th>Drawn</th><th>Lost</th>' +
      '<th>Ippon For</th><th>Ippon Against</th><th>Points</th>' +
      '</tr></thead><tbody>';
    rows.forEach(function (r, i) {
      html += '<tr><td>' + (i + 1) + '</td><td>' + esc(r.name) + '</td><td>' + r.elo + '</td>' +
        '<td>' + r.played + '</td><td>' + r.won + '</td><td>' + r.drawn + '</td><td>' + r.lost + '</td>' +
        '<td>' + r.ipFor + '</td><td>' + r.ipAgainst + '</td><td><strong>' + r.points + '</strong></td></tr>';
    });
    html += '</tbody></table>';
  }
  if (appState.updatedAt) {
    var d = new Date(appState.updatedAt);
    html += '<p class="updated">Last updated ' +
      d.toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) + '</p>';
  }
  html += '</div>';
  el.innerHTML = html;
}

/* ---------- fighters ---------- */

var selectedFighterId = null;

function statHtml(num, label) {
  return '<div class="stat"><div class="num">' + num + '</div><div class="lbl">' + esc(label) + '</div></div>';
}

// Season stats for one fighter, computed from the state the page already has.
function fighterStats(pid) {
  var s = appState.settings;
  var st = {
    elo: 0, points: 0, turns: 0, played: 0, won: 0, drawn: 0, lost: 0,
    ipFor: 0, ipAgainst: 0, hansoku: 0,
    types: { Men: 0, Kote: 0, Do: 0, Tsuki: 0, Hansoku: 0 },
    awards: []
  };
  var p = playerById(pid);
  if (p) st.elo = p.elo;
  appState.turnPlayers.forEach(function (tp) { if (tp.playerId === pid) st.turns++; });
  appState.turns.forEach(function (t) {
    if (t.fightingSpirit === pid) st.awards.push(t);
  });
  appState.matches.forEach(function (m) {
    if (!m.completed) return;
    var isWhite = m.whiteId === pid;
    var isRed = m.redId === pid;
    if (!isWhite && !isRed) return;
    st.played++;
    if (isWhite) {
      st.ipFor += m.whiteIppon;
      st.ipAgainst += m.redIppon;
      st.hansoku += m.whiteHansoku;
      (m.whiteIpponTypes || []).forEach(function (t) { if (st.types[t] !== undefined) st.types[t]++; });
      if (m.result === 'White') { st.won++; st.points += s.winPoints; }
      else if (m.result === 'Red') { st.lost++; st.points += s.lossPoints; }
      else if (m.result === 'Draw') { st.drawn++; st.points += s.drawPoints; }
    } else {
      st.ipFor += m.redIppon;
      st.ipAgainst += m.whiteIppon;
      st.hansoku += m.redHansoku;
      (m.redIpponTypes || []).forEach(function (t) { if (st.types[t] !== undefined) st.types[t]++; });
      if (m.result === 'Red') { st.won++; st.points += s.winPoints; }
      else if (m.result === 'White') { st.lost++; st.points += s.lossPoints; }
      else if (m.result === 'Draw') { st.drawn++; st.points += s.drawPoints; }
    }
  });
  return st;
}

function renderFighters() {
  var el = document.getElementById('tab-fighters');
  if (!appState) { el.innerHTML = '<div class="panel"><p>Loading...</p></div>'; return; }
  var players = appState.players.slice().sort(function (a, b) { return a.name.localeCompare(b.name); });
  if (!players.length) {
    el.innerHTML = '<div class="panel"><h2>Fighters</h2><p class="empty">No fighters yet - add a player to get started.</p></div>';
    return;
  }
  if (!selectedFighterId || !playerById(selectedFighterId)) selectedFighterId = players[0].id;
  var p = playerById(selectedFighterId);
  var st = fighterStats(p.id);
  var html = '<div class="panel"><h2>Fighters</h2>' +
    '<div class="pick-row"><label for="fighterSelect">Fighter</label>' +
    '<select id="fighterSelect">' +
    players.map(function (pl) {
      return '<option value="' + esc(pl.id) + '"' + (pl.id === p.id ? ' selected' : '') + '>' + esc(pl.name) + '</option>';
    }).join('') +
    '</select>';
  if (isEditor()) {
    if (st.played === 0) {
      html += '<button class="btn small danger" data-action="delete-fighter" data-player="' + esc(p.id) + '">Delete fighter</button>';
    } else {
      html += '<span class="hint">A fighter with matches cannot be deleted.</span>';
    }
  }
  html += '</div>';
  html += '<div class="stat-grid">' +
    statHtml(st.elo, 'Elo') + statHtml(st.points, 'Points') + statHtml(st.turns, 'Turns attended') +
    statHtml(st.played, 'Matches') + statHtml(st.won, 'Won') + statHtml(st.drawn, 'Drew') + statHtml(st.lost, 'Lost') +
    statHtml(st.ipFor, 'Ippon for') + statHtml(st.ipAgainst, 'Ippon against') + statHtml(st.hansoku, 'Hansoku') +
    '</div>';
  html += '<p><strong>Ippons scored by type:</strong> ' +
    esc(['Men', 'Kote', 'Do', 'Tsuki', 'Hansoku'].map(function (t) { return t + ': ' + st.types[t]; }).join(' · ')) + '</p>';
  if (st.awards.length) {
    html += '<p><strong>Fighting Spirit awards:</strong> ' +
      esc(st.awards.map(function (t) { return t.name; }).join(', ')) + '</p>';
  } else {
    html += '<p class="empty">No Fighting Spirit awards yet.</p>';
  }
  html += '</div>';
  var turnById = {};
  appState.turns.forEach(function (t) { turnById[t.id] = t; });
  var ms = appState.matches
    .filter(function (m) { return m.whiteId === p.id || m.redId === p.id; })
    .sort(function (a, b) {
      var da = (turnById[a.turnId] && turnById[a.turnId].date) || '';
      var db = (turnById[b.turnId] && turnById[b.turnId].date) || '';
      if (db !== da) return db.localeCompare(da);
      if (b.round !== a.round) return b.round - a.round;
      return matchNum(b.id) - matchNum(a.id);
    });
  html += '<div class="panel"><h2>Match history</h2>';
  if (!ms.length) {
    html += '<p class="empty">No matches yet.</p>';
  } else {
    ms.forEach(function (m) {
      html += matchCardHtml(m, turnById[m.turnId] || { name: 'Unknown turn' });
    });
  }
  html += '</div>';
  el.innerHTML = html;
}

/* ---------- actions ---------- */

function setTab(name) {
  currentTab = name;
  document.querySelectorAll('.tab').forEach(function (b) {
    b.classList.toggle('active', b.dataset.tab === name);
  });
  ['schedule', 'results', 'scoreboard', 'fighters'].forEach(function (t) {
    document.getElementById('tab-' + t).hidden = (t !== name);
  });
}

function readSelect(card, field) {
  var sel = card.querySelector('select[data-f="' + field + '"]');
  return sel ? parseInt(sel.value, 10) : 0;
}

function readTypeSelects(card, side) {
  var vals = [];
  var i = 0;
  var sel;
  while ((sel = card.querySelector('select[data-f="' + side + 'IpponType' + i + '"]'))) {
    vals.push(sel.value || '');
    i++;
  }
  return vals;
}

async function handleAction(action, target) {
  var turnId = target.dataset.turn;
  var rowIndex = target.dataset.row ? parseInt(target.dataset.row, 10) : null;
  var matchId = target.dataset.match;
  try {
    if (action === 'save-match') {
      var card = target.closest('.match');
      target.disabled = true;
      await api('recordMatch', {
        matchId: matchId,
        whiteIppon: readSelect(card, 'whiteIppon'),
        redIppon: readSelect(card, 'redIppon'),
        whiteHansoku: readSelect(card, 'whiteHansoku'),
        redHansoku: readSelect(card, 'redHansoku'),
        whiteIpponTypes: readTypeSelects(card, 'white'),
        redIpponTypes: readTypeSelects(card, 'red')
      });
      showStatus('Score saved.');
    } else if (action === 'delete-fighter') {
      var pid = target.dataset.player;
      if (!window.confirm('Delete ' + playerName(pid) + '? This cannot be undone.')) return;
      await api('deletePlayer', { playerId: pid });
      selectedFighterId = null;
      showStatus('Fighter deleted.');
    } else if (action === 'save-turn-players') {
      var ids = [];
      document.querySelectorAll('input[type="checkbox"][data-turn="' + turnId + '"]:checked')
        .forEach(function (cb) { ids.push(cb.value); });
      await api('setTurnPlayers', { turnId: turnId, playerIds: ids });
      showStatus('Players saved for this turn.');
    } else if (action === 'generate-round') {
      var gen = await api('generateRound', { turnId: turnId });
      showStatus('Round ' + gen.round + ' generated.');
    } else if (action === 'set-status') {
      var sel = document.getElementById('status-' + turnId);
      await api('setTurnStatus', { turnId: turnId, status: sel.value });
      showStatus('Turn status updated.');
    } else if (action === 'mark-complete') {
      await api('setTurnStatus', { turnId: turnId, status: 'Complete' });
      showStatus('Turn marked complete.');
    } else if (action === 'save-fighting-spirit') {
      var fsSel = document.getElementById('fs-' + turnId);
      await api('setFightingSpirit', { turnId: turnId, playerId: fsSel ? fsSel.value : '' });
      showStatus('Fighting Spirit winner saved.');
    } else if (action === 'edit-turn-date') {
      editingTurnDate = turnId;
      render();
      return;
    } else if (action === 'cancel-turn-date') {
      editingTurnDate = null;
      render();
      return;
    } else if (action === 'save-turn-date') {
      var newDate = document.getElementById('te-date-' + turnId).value;
      await api('updateTurnDate', { turnId: turnId, date: newDate });
      editingTurnDate = null;
      showStatus('Turn date updated.');
    } else {
      return;
    }
    await fetchState();
  } catch (err) {
    showStatus(err.message || 'Something went wrong. Please try again.', true);
    if (target) target.disabled = false;
  }
}

document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-action]');
  if (!t) return;
  handleAction(t.dataset.action, t);
});

// Dropdown changes: fighter picker, results turn picker, and the
// per-ippon type dropdowns that follow an ippon-count change.
document.addEventListener('change', function (e) {
  var sel = e.target;
  if (!sel || sel.tagName !== 'SELECT') return;
  if (sel.id === 'fighterSelect') {
    selectedFighterId = sel.value;
    renderFighters();
    return;
  }
  if (sel.id === 'resultsTurnSelect') {
    selectedResultsTurnId = sel.value;
    render();
    return;
  }
  var f = sel.getAttribute('data-f');
  if (f !== 'whiteIppon' && f !== 'redIppon') return;
  var card = sel.closest('.match');
  if (!card) return;
  var side = f === 'whiteIppon' ? 'white' : 'red';
  var count = parseInt(sel.value, 10) || 0;
  var holder = card.querySelector('[data-types="' + side + '"]');
  if (!holder) return;
  var kept = [];
  holder.querySelectorAll('select').forEach(function (s) { kept.push(s.value); });
  var html = '';
  for (var i = 0; i < count; i++) {
    html += '<select data-f="' + side + 'IpponType' + i + '">' + ipponTypeOptions(kept[i] || '') + '</select>';
  }
  holder.innerHTML = html;
});

document.addEventListener('submit', async function (e) {
  if (e.target.id === 'createPlayerForm') {
    e.preventDefault();
    var firstName = document.getElementById('npFirst').value.trim();
    var lastName = document.getElementById('npLast').value.trim();
    if (!firstName || !lastName) return;
    try {
      await api('createPlayer', { firstName: firstName, lastName: lastName });
      showStatus('Player added.');
      await fetchState();
    } catch (err) {
      showStatus(err.message || 'Could not add the player.', true);
    }
  } else if (e.target.id === 'createTurnForm') {
    e.preventDefault();
    var tdate = document.getElementById('ntDate').value;
    if (!tdate) return;
    try {
      await api('createTurn', { date: tdate });
      showStatus('Turn created.');
      await fetchState();
    } catch (err) {
      showStatus(err.message || 'Could not create the turn.', true);
    }
  } else if (e.target.id === 'loginForm') {
    e.preventDefault();
    var user = document.getElementById('loginUser').value.trim();
    var pass = document.getElementById('loginPass').value;
    var errEl = document.getElementById('loginError');
    try {
      var res = await fetch(WEBAPP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'login', username: user, password: pass })
      });
      var data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Login failed.');
      editorCreds = { username: user, password: pass };
      sessionStorage.setItem('dsl_user', user);
      sessionStorage.setItem('dsl_pass', pass);
      document.getElementById('loginModal').hidden = true;
      errEl.hidden = true;
      showStatus('Logged in as editor.');
      await fetchState();
    } catch (err) {
      errEl.textContent = err.message || 'Login failed.';
      errEl.hidden = false;
    }
  }
});

/* ---------- login / logout / tabs ---------- */

document.getElementById('loginBtn').addEventListener('click', function () {
  document.getElementById('loginModal').hidden = false;
  document.getElementById('loginUser').focus();
});

document.getElementById('loginCancel').addEventListener('click', function () {
  document.getElementById('loginModal').hidden = true;
  document.getElementById('loginError').hidden = true;
});

document.getElementById('logoutBtn').addEventListener('click', function () {
  editorCreds = null;
  sessionStorage.removeItem('dsl_user');
  sessionStorage.removeItem('dsl_pass');
  showStatus('Logged out.');
  render();
});

document.querySelectorAll('.tab').forEach(function (b) {
  b.addEventListener('click', function () { setTab(b.dataset.tab); });
});

document.getElementById('toTopBtn').addEventListener('click', function () {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

window.addEventListener('scroll', function () {
  document.getElementById('toTopBtn').hidden = window.scrollY < 300;
});

async function restoreSession() {
  var user = sessionStorage.getItem('dsl_user');
  var pass = sessionStorage.getItem('dsl_pass');
  if (!user || !pass || !WEBAPP_URL) return;
  try {
    var res = await fetch(WEBAPP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'login', username: user, password: pass })
    });
    var data = await res.json();
    if (data.ok) {
      editorCreds = { username: user, password: pass };
    } else {
      sessionStorage.removeItem('dsl_user');
      sessionStorage.removeItem('dsl_pass');
    }
  } catch (err) {
    // Stay logged out; the next fetch will show the load error.
  }
  updateAuthUI();
}

/* ---------- polling ---------- */

setInterval(function () {
  if (document.visibilityState !== 'visible') return;
  // Do not wipe a form the editor is using.
  var active = document.activeElement;
  if (active && (active.tagName === 'SELECT' || active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return;
  if (editingTurnDate !== null) return;
  if (!document.getElementById('loginModal').hidden) return;
  fetchState();
}, 15000);

document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible') fetchState();
});

/* ---------- start ---------- */

restoreSession().then(fetchState);
</script>
